<!doctype html>
<html lang="zh-HK">
<head>
<meta name="robots" content="noindex, nofollow">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>個人短講｜四種模式頁面總覽</title>
  <style>
    :root{font-family:"PingFang HK","Noto Sans CJK HK","Noto Sans HK","Microsoft JhengHei",sans-serif;color:#243449;background:#eef6fa}
    *{box-sizing:border-box}
    body{margin:0}
    header{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px max(20px,calc((100vw - 1280px)/2));background:#f8fcfe;border-bottom:1px solid #d5e6ef}
    header strong{font-size:16px;white-space:nowrap}
    nav{display:flex;gap:8px;overflow-x:auto}
    nav a{flex:none;padding:8px 12px;border:1px solid #cfe5ef;border-radius:18px;background:#fff;color:#27657f;text-decoration:none;font-size:13px;line-height:18px}
    nav a:hover,nav a:focus-visible{border-color:#059cdb;color:#007eab}
    nav a.report-link,.mode.report-mode h1{color:#b42318}
    main{width:min(100%,1320px);margin:auto;padding:18px 20px 48px}
    .mode{scroll-margin-top:74px;padding:12px 0 26px;border-bottom:1px solid #d5e6ef}
    .mode:last-child{border:0}
    .mode-head{display:flex;align-items:baseline;gap:12px;margin:0 0 14px}
    h1{margin:0;font-size:20px;line-height:28px}
    .count{font-size:12px;color:#667b8f}
    .gallery{display:grid;grid-template-columns:repeat(auto-fill,190px);gap:14px}
    .page{min-width:0;margin:0}
    .page figcaption{min-height:38px;display:flex;align-items:center;font-size:13px;line-height:18px;font-weight:600}
    .page.changed figcaption{color:#b42318}
    .page button{display:block;width:100%;padding:0;border:1px solid #cce4ef;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 5px 18px #305f7b14;cursor:zoom-in}
    .page button:hover,.page button:focus-visible{border-color:#129ed6;outline:2px solid #129ed640;outline-offset:2px}
    .page img{display:block;width:100%;height:auto;aspect-ratio:390/902;object-fit:cover}
    .legend{margin:0 0 8px;color:#b42318;font-size:12px}
    dialog{max-width:min(96vw,520px);max-height:96vh;padding:10px;border:0;border-radius:16px;box-shadow:0 20px 80px #17374d66}
    dialog::backdrop{background:#102a3bb8}
    dialog img{display:block;max-width:100%;max-height:calc(96vh - 58px);margin:auto;object-fit:contain}
    dialog button{display:block;margin:8px 0 0 auto;border:0;border-radius:8px;padding:7px 15px;background:#e7f6fc;color:#007eab;font:600 13px/18px inherit;cursor:pointer}
    @media(max-width:760px){header{align-items:flex-start;flex-direction:column;padding:10px 14px}nav{width:100%}main{padding:12px 14px 36px}.mode{scroll-margin-top:118px}.gallery{grid-template-columns:repeat(auto-fill,190px);gap:10px}.page figcaption{font-size:12px}}
    @media(max-width:420px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}
  </style>
<script id="github-pages-prototype-redirect">if(location.hostname==="chineserd.github.io")location.replace("https://chineserd-prototypes.pages.dev"+location.pathname+location.search+location.hash);</script>
</head>
<body>
  <header><strong>個人短講 · 靜態總覽</strong><nav aria-label="四種模式"></nav></header>
  <main><p class="legend">紅色表示本次調整</p><div id="modes"></div></main>
  <dialog id="preview" aria-label="放大查看頁面"><img alt=""><button type="button">關閉</button></dialog>
  <script>
    const root=document.querySelector('#modes')
    const nav=document.querySelector('nav')
    const dialog=document.querySelector('#preview')
    dialog.querySelector('button').addEventListener('click',()=>dialog.close())
    dialog.addEventListener('click',event=>{if(event.target===dialog)dialog.close()})
    fetch('./pages.json').then(response=>response.json()).then(sections=>{
      for(const section of sections){
        const link=document.createElement('a')
        link.href='#'+section.id
        link.textContent=section.title
        if(section.id==='reports')link.classList.add('report-link')
        nav.append(link)
        const board=document.createElement('section')
        board.className='mode'+(section.id==='reports'?' report-mode':'')
        board.id=section.id
        const head=document.createElement('div')
        head.className='mode-head'
        const title=document.createElement('h1')
        title.textContent=section.title
        const count=document.createElement('span')
        count.className='count'
        count.textContent=section.pages.length+' 個頁面'
        head.append(title,count)
        const gallery=document.createElement('div')
        gallery.className='gallery'
        for(const item of section.pages){
          const figure=document.createElement('figure')
          figure.className='page'+(item.changed?' changed':'')
          const label=document.createElement('figcaption')
          label.textContent=item.label
          const button=document.createElement('button')
          button.type='button'
          button.setAttribute('aria-label','放大查看'+item.label)
          const img=document.createElement('img')
          img.src='./current-pages/'+item.file
          img.alt=item.label+'原型頁面'
          img.loading='lazy'
          button.append(img)
          button.addEventListener('click',()=>{
            const enlarged=dialog.querySelector('img')
            enlarged.src=img.src
            enlarged.alt=img.alt
            dialog.showModal()
          })
          figure.append(label,button)
          gallery.append(figure)
        }
        board.append(head,gallery)
        root.append(board)
      }
    }).catch(()=>{root.textContent='頁面圖片暫時無法載入。'})
  </script>
</body>
</html>
