2.2\",\"1.2.3\",\"1.2.4\"],\"markdown\":\"\"},\"1.2.1\":{\"id\":\"1.2.1\",\"title\":\"總分分布\",\"parentId\":\"1.2\",\"children\":[],\"markdown\":\"本班共8篇作文納入總分統計，平均分為51.8分，最低34分，最高65分。人數最多的分數區間為50–\u0026#60;60分，有3人（37.5%）。\\n\\n| 總分區間（分） | 人數 | 比例 |\\n| --- | --- | --- |\\n| 30–\u0026#60;40 | 1人 | 12\u0026#46;5% |\\n| 40–\u0026#60;50 | 2人 | 25% |\\n| 50–\u0026#60;60 | 3人 | 37\u0026#46;5% |\\n| 60–\u0026#60;70 | 2人 | 25% |\",\"kind\":\"distribution\"},\"1.2.2\":{\"id\":\"1.2.2\",\"title\":\"分項達成\",\"parentId\":\"1.2\",\"children\":[],\"markdown\":\"##### 內容\\n\\n**立意與內容展開**\\n\\n| 分析細項 | 達到要求 | 未達到要求 |\\n| --- | --- | --- |\\n| 人物條件 | 7篇（87\u0026#46;5%） | 1篇（12\u0026#46;5%） |\\n| 單一人物 | 7篇（87\u0026#46;5%） | 1篇（12\u0026#46;5%） |\\n| 事迹支撐 | 5篇（62\u0026#46;5%） | 3篇（37\u0026#46;5%） |\\n| 細節與感染力 | 0篇（0\u0026#46;0%） | 8篇（100\u0026#46;0%） |\\n| 事迹與啟發的關聯 | 4篇（50\u0026#46;0%） | 4篇（50\u0026#46;0%） |\\n| 個人啟發 | 4篇（50\u0026#46;0%） | 4篇（50\u0026#46;0%） |\\n| 值得學習的品德 | 6篇（75\u0026#46;0%） | 2篇（25\u0026#46;0%） |\\n\\n##### 表達、結構與標點字體\\n\\n| 分類 | 分析細項 | 達到要求 | 未達到要求 |\\n| --- | --- | --- | --- |\\n| 表達 | 表達方式 | 4篇（50\u0026#46;0%） | 4篇（50\u0026#46;0%） |\\n| 表達 | 語言表達 | 1篇（12\u0026#46;5%） | 7篇（87\u0026#46;5%） |\\n| — | 結構分析 | 4篇（50\u0026#46;0%） | 4篇（50\u0026#46;0%） |\\n| — | 標點字體 | 7篇（87\u0026#46;5%） | 1篇（12\u0026#46;5%） |\"},\"4.1\":{\"id\":\"4.1\",\"title\":\"優秀案例｜案例一\",\"parentId\":\"4\",\"children\":[],\"markdown\":\"能把屠呦呦堅持研究的精神與自身排球訓練經歷聯繫，寫出較具個人色彩的啟發。\",\"caseStudy\":{\"essay\":{\"title\":\"習作全文\",\"markdown\":\"「呦呦鹿鳴，食野之蒿」這句  \\n詩，剛好映照着屠呦呦的一生。作  \\n為當代中國極具影響力的科學家，  \\n她埋首研究多年反覆實驗，歷  \\n經無數次失敗，也不放棄。最終成  \\n功帶領團隊提取青蒿素，挽救百萬  \\n人的生命，她不畏艱辛、勇於探索  \\n的精神深深打動了後世人。\\n\\n在研究的路上，屠呦呦面對重  \\n重困境。當時科研設備簡陋，物資  \\n短缺，但屠呦呦並没有停下研究的  \\n腳步。她帶領團隊繼續深耕，參考\\n\\n古代醫籍，從「青蒿一握，以水二  \\n升漬，絞取汁，盡服之」得到靈感  \\n。經過上百次失敗實驗，加上提取  \\n藥物的安全未知，她甚至甘願親身  \\n試藥，冒着健康的風險，最終成功  \\n提取青蒿素，挽救數百萬人的生命  \\n。取得成就後，她仍不停步，繼續  \\n研藥效更好的雙氫青蒿素，探索治  \\n療紅斑狼瘡的方法，同時鑽研對抗  \\n原原抗藥的方案，一生理首科研  \\n，守護世界各地病患的生命。\\n\\n屠呦呦永不言敗的精神，讓我  \\n想起排球的經歷。練習扣球時，我  \\n總是掌握不好力度與起跳時機，屢  \\n次扣球出界，一度想放棄訓練。對  \\n比屠呦呦面對數百次實驗失敗仍持  \\n續鑽研，我明白自己不該輕易退縮  \\n。我不再氣餒，不斷反覆練習、調  \\n整姿勢，修正起跳與揮臂细節，慢\\n\\n慢找到節奏。這讓我明白，無論科  \\n研還是排球，挫折不是終點，而是  \\n找出問題、繼續嘗試的起點；真正  \\n的堅持，不是硬撐，而是受挫之後  \\n，依然願意沉下心改進。\\n\\n屠呦呦以古籍為啟迪，默默鑽研  \\n。為國家與世界醫學作出重大貢獻  \\n。她不求名利，令我十分敬佩。我  \\n會以她為榜樣，堅持努力，在學習  \\n路上持之以恆，將來也能盡自己的  \\n力量，幫助身邊的人。\"},\"assessment\":{\"title\":\"原評分與評語\",\"total\":\"總分：59／100\",\"dimensions\":[{\"name\":\"內容\",\"score\":\"26／40\",\"comment\":\"內容緊扣一位對當代中國有貢獻的人物，交代屠呦呦從古代醫籍取得靈感、反覆實驗、親身試藥及繼續研究等事跡，能說明其醫學貢獻。第三段把科研中的堅持與自己的排球訓練相連，從「受挫後改進」的角度提煉啟發，並在結尾指出持之以恆、幫助他人的實踐方向，事迹、品德與個人感悟有一定聯繫。不過，主要事迹偏向資料式概述，對親身試藥、實驗失敗或取得突破等關鍵時刻缺乏具體場景和細節，感染力有限；後段列舉多項後續研究，亦未逐一展開，略顯堆疊。\"},{\"name\":\"表達\",\"score\":\"16／30\",\"comment\":\"開首引用「呦呦鹿鳴，食野之蒿」，能呼應人物姓名及青蒿研究；「挫折不是終點，而是找出問題、繼續嘗試的起點」等句子能清楚表達感悟。整體語意大致明白，但部分搭配和字詞使用不準確，如「繼續研藥效更好的雙氫青蒿素」句式欠完整，「原原抗藥」「一生理首科研」語意不通；「深深打動了後世人」也較籠統。部分長句連續交代多項資料，節奏較急，宜拆分句子並選用更準確、自然的動詞和搭配。\"},{\"name\":\"結構\",\"score\":\"11／20\",\"comment\":\"全文依次安排人物引入、主要事迹、個人經歷與啟發、總結立志，層次清楚，第三段由人物事迹轉入自身經驗，過渡自然，首尾亦能呼應榜樣作用。然而主體段承載的資料過多，從研究困境、古籍啟發、親身試藥到後續研究均集中於一段，詳略不夠鮮明；最值得刻畫的突破過程反而較簡略。結尾能收束中心，但「堅持努力」「幫助身邊的人」較概括，可更具體回扣科研精神及個人行動。\"},{\"name\":\"標點字體\",\"score\":\"6／10\",\"comment\":\"書寫表現優秀，字跡清晰且標點規範，展現了良好的書寫習慣。\"}],\"commentary\":[{\"label\":\"原總評\",\"markdown\":\"文章選取屠呦呦為中心人物，能以青蒿素研究事跡突出其堅持探索、勇於承擔和淡泊名利的品德，並聯繫自身排球訓練經歷，寫出較具個人色彩的啟發，整體扣題。惟人物事跡多以概述和羅列呈現，關鍵場面及人物形象未充分展開；部分詞語誤用或句子不完整，也削弱了表達的準確性和流暢度。\"}]},\"revision\":{\"title\":\"修改示範\",\"fields\":[{\"label\":\"修改維度\",\"markdown\":\"表達　｜　原得分：16／30\"},{\"label\":\"原文片段\",\"markdown\":\"\u003e 同時鑽研對抗原原抗藥的方案，一生理首科研，守護世界各地病患的生命。\"},{\"label\":\"問題說明\",\"markdown\":\"存在明顯錯別字及語意不通。「原原抗藥」應為「原蟲抗藥」或相關專業術誤；「一生理首」語意不明，推測為「一生埋首」或「一生致力於」之誤。\"},{\"label\":\"修改示範\",\"markdown\":\"**教學示範，非學生原文**\\n\\n改為「同時鑽研應對瘧原蟲抗藥性的方案，一生埋首科研，守護世界各地病患的生命。」\"},{\"label\":\"修改建議\",\"markdown\":\"修正錯別字，確保專業術語準確，並調整動詞搭配使語句通順。\"}]}}},\"4.2\":{\"id\":\"4.2\",\"title\":\"優秀案例｜案例二\",\"parentId\":\"4\",\"children\":[],\"markdown\":\"以蘇炳添改變技術、突破紀錄的經歷呈現人物精神，並以短跑意象呼應個人成長，層次基本完整。\",\"caseStudy\":{\"essay\":{\"title\":\"習作全文\",\"markdown\":\"長久以來，男子百米跑一直都  \\n被歐美選手壟斷，但普遍都認為亞  \\n洲運動員難以登上世界頂峰。然而  \\n中國短跑運動員——蘇炳添，憑着  \\n努力和堅毅，成功打破了這個觀念  \\n。他不僅在體壇上屢創佳績，更以  \\n自強不息的精神，向世界展現了現  \\n代中國體育人的力量與風采。\\n\\n蘇炳添在十五歲起就開始接受專業  \\n訓練。直到在二零一四年，二十四  \\n歲的他卻陷入了職業生涯的沉寂期  \\n。他的成績一直停滯不前，始終無\\n\\n法突破十秒內的關卡。他為了突破  \\n自我，他毅然做出了重大的決定，  \\n要打破十多年來習慣的起跑技術，  \\n將起跑腳從右腳改為左腳。這意味  \\n著要打破十幾年累積的肌肉記憶。  \\n改掉自己練了多年的動作也非  \\n常困難，等同於要重新適應身體的  \\n習慣。訓練過程十分辛苦，要常常  \\n練到肌肉酸痛，剛改動作時成績反  \\n而退步。但蘇炳添沒有放棄，每日  \\n不斷練習，慢慢調整自己的動作。  \\n一般短跑選手在三十歲左右就要退  \\n役，可是年過三十歲的他仍舊堅持  \\n苦練。終於在二零二一年東京奧運  \\n百米總決賽中，他跑出九秒八三的  \\n佳績，創下了亞洲紀錄。那短短的  \\n九秒八三，不僅是電子計時器上閃  \\n爍的數字，更是他無數個日夜的汗  \\n水與傷痛鑄就歷史豐碑。最終成為\\n\\n首位奧運百米決賽的中國運動員，  \\n證明亞洲人也可以站上國際頂尖賽場  \\n場，成名後的蘇炳添仍然謙虛踏實  \\n，經常鼓勵年輕人，不要輕易認定  \\n自己極限，要勇敢挑戰自我，蘇炳  \\n添擁有堅毅不拔。永不言棄的優秀  \\n品質，更展現出不怕辛苦，勇於嘗  \\n試，克服困難的精神。\\n\\n我們身為新時代的青少年，我  \\n們的學習和成長就如一場短跑。面  \\n對讀書難題和成長困阻，我從蘇炳  \\n添的故事明白到：所謂的極限，大  \\n多數都是自己的心態限制。只要我  \\n們堅持不懈，腳踏實地，就能突破  \\n自我。將來，我定會以這份自強不  \\n息的精神走好每一步，不負韶華，  \\n努力將個人的成長融入社會與國家  \\n進步之中，跑出屬於我們這一代人  \\n的精彩與榮耀。\"},\"assessment\":{\"title\":\"原評分與評語\",\"total\":\"總分：61／100\",\"dimensions\":[{\"name\":\"內容\",\"score\":\"26／40\",\"comment\":\"文章聚焦蘇炳添一人，交代他改變起跑技術、克服成績停滯、年過三十仍堅持訓練，最終創下亞洲紀錄的經歷，能以具體成就說明其影響力，並從中提煉堅毅、自強、勇於突破等品德。結尾亦寫出自己面對學習和成長困難時應有的態度，回應個人啟發。不過，主體主要按經歷概述，對改變起跑腳後如何反覆調整、面對退步時的心理與行動着墨不足；「鼓勵年輕人」等內容也較籠統。若集中刻畫一個關鍵訓練或比賽場面，並把啟發落實到具體學習行動，內容會更有感染力和個人特色。\"},{\"name\":\"表達\",\"score\":\"16／30\",\"comment\":\"語言整體清楚，能運用「那短短的九秒八三，不僅是電子計時器上閃爍的數字」等句子突出成就背後的付出，結尾以「短跑」「每一步」「跑出」形成呼應，具一定修辭效果。然而，部分表達不夠準確或順暢，如「他為了突破自我，他毅然……」主語重複，「始終無法突破十秒內的關卡」搭配欠妥，「最終成為首位奧運百米決賽的中國運動員」成分不完整；「蘇炳添擁有堅毅不拔。永不言棄的優秀品質」亦割裂了句意。宜刪去贅詞，補足句子成分，並注意動詞與賓語的搭配，使敘述更凝練準確。\"},{\"name\":\"結構\",\"score\":\"12／20\",\"comment\":\"全文採用「人物及成就引入—受挫與改變—突破紀錄—提煉品德與個人感悟」的安排，層次基本完整，首尾均以短跑意象連繫人物事跡與青少年成長。主體段按時間推進，因果關係大致清楚。不過，第二段承載背景、訓練、比賽、成名後表現及品德概括等多項內容，篇幅過長，後半由奧運成績轉到人物品德時較急促。可把「改變技術與艱苦訓練」「奧運突破及其影響」「品德與啟發」分段處理，並加入由事及理的過渡句，以改善節奏和詳略。\"},{\"name\":\"標點字體\",\"score\":\"7／10\",\"comment\":\"書寫表現優秀，字跡娟秀且規範，標點運用得宜，是一份賞心悅目的卷面。\"}],\"commentary\":[{\"label\":\"原總評\",\"markdown\":\"文章選取蘇炳添突破短跑極限的事跡，能扣緊「貢獻、事跡、啟發與品德」等要求，人物精神鮮明，亦能把個人成長與國家進步聯繫起來。主要不足是事跡多以概述方式交代，關鍵訓練過程缺少具體場景和細節；部分句子重複、搭配不當或成分殘缺，削弱了表達的準確性與流暢度。\"}]},\"revision\":{\"title\":\"修改示範\",\"fields\":[{\"label\":\"修改維度\",\"markdown\":\"表達　｜　原得分：16／30\"},{\"label\":\"原文片段\",\"markdown\":\"\u003e 他為了突破自我，他毅然做出了重大的決定\"},{\"label\":\"問題說明\",\"markdown\":\"主語重複，造成語句囉嗦且不流暢。\"},{\"label\":\"修改示範\",\"markdown\":\"**教學示範，非學生原文**\\n\\n改為：他為了突破自我，毅然做出了重大的決定\"},{\"label\":\"修改建議\",\"markdown\":\"刪除第二個多餘的主語「他」，保持句子主謂賓結構清晰簡潔。\"}]}}},\"4.3\":{\"id\":\"4.3\",\"title\":\"改進案例｜案例三\",\"parentId\":\"4\",\"children\":[],\"markdown\":\"技術原理介紹佔幅較多，人物面對困難與反覆試驗的過程較簡略，可用於分析詳略安排與人物刻畫。\",\"caseStudy\":{\"essay\":{\"title\":\"習作全文\",\"markdown\":\"在當代中國中，我們有不少為  \\n中國作出巨大貢獻的科學家，例如  \\n：高錕和錢學森。但雖獨有一位，  \\n他讓無數中國平民百姓吃到飽飯。  \\n他就是「雜交水稻之父」——袁隆  \\n平先生。\\n\\n袁隆平出生在一九三零年的江  \\n西省。當時中國人口眾多，耕地面  \\n積受限。百姓經常面臨饑餓的問題  \\n。「吃飽飯」便是在國家發展時的  \\n頭號難題。袁隆平在長大後決定解  \\n決這一個大難題，於是他帶領着李\\n\\n必湖、袁定陽和郭夏宇等人將心血  \\n傾注在水稻研究上。他頂着重重壓  \\n力，在田間地頭進行無數次實驗。  \\n終於在一九七三年成功研發出三系  \\n雜交水稻，令水稻育種的歷史性突  \\n破。緩解了全國的糧食危機。三系  \\n雜水稻有三種培育方法。\\n\\n第一，不育系（母本）：它的  \\n特徵是它無法進行自花授粉但它可  \\n以接受外來花粉去授粉（雌蕊正常  \\n）由於它不會自行授粉，因此大幅  \\n提高雜交種子的純度。\\n\\n第二，保持系，使用保持系的  \\n花粉授給不育系，主要工作就像「保  \\n姆」一樣，專門繁殖不育系的種子。  \\n讓不育系不會絕種。\\n\\n第三，恢復系，這是一種擁有  \\n生命力和花粉的水稻。與不育系雜交  \\n後，不但會有正常的開花結果系，更\\n\\n擁有恢復系的優質基因，產量會變  \\n得更多和强壯。\\n\\n正因為袁隆平爺爺，我們中國  \\n用了不超過百分之十的土地養活了  \\n全球五分之一的人。\\n\\n總結來説：袁隆平用了一粒種  \\n子和數年的歲月改變了中國，甚至  \\n整個世界。中國能發展到這地步也  \\n要感謝每一個在後面默默付出的每  \\n個科學。有他們才有現在中國的繁  \\n榮。在袁隆平身上我明白到我們就  \\n算失敗了無數也不要放棄的精神。  \\n我們也要好好珍惜每一粒糧食。\"},\"assessment\":{\"title\":\"原評分與評語\",\"total\":\"總分：50／100\",\"dimensions\":[{\"name\":\"內容\",\"score\":\"22／40\",\"comment\":\"文章明確聚焦袁隆平，交代糧食短缺的時代背景、研發雜交水稻及其對糧食供應的貢獻，基本切合題意。結尾亦提煉出面對失敗不放棄和珍惜糧食的啟發。然而，核心事跡主要以概述方式帶過，如「頂着重重壓力」和「進行無數次實驗」均未交代具體困難、行動或關鍵場景；相反，不育系、保持系、恢復系的技術說明較長，未能直接突出人物的感人或傑出之處。可選取一個研究受挫後仍堅持試驗的典型事件詳寫，並具體說明自己將如何在學習或生活中實踐其品德。\"},{\"name\":\"表達\",\"score\":\"12／30\",\"comment\":\"語意大致可辨，部分比喻如把保持系比作「保姆」，有助解釋概念；「用了一粒種子和數年的歲月改變了中國」亦能概括人物貢獻。不過，多處用詞和搭配不夠準確，例如「但雖獨有一位」、「令水稻育種的歷史性突破」、「正常的開花結果系」、「每個科學」等，影響流暢度和表意。部分句子成分殘缺或邏輯關係鬆散，科技術語的密集解說也使語氣偏說明性。宜先確保主謂賓完整，選用準確詞語，並增加動作、環境或人物反應的描寫，使敘述更具畫面感。\"},{\"name\":\"結構\",\"score\":\"10／20\",\"comment\":\"文章具備引入人物、交代背景與成就、說明技術、總結感悟的基本框架，首尾均圍繞袁隆平的貢獻。惟主體詳略失衡：三個技術段落篇幅較多，真正應作重點的研究歷程和人物精神反而一筆帶過；由事跡轉入技術原理較突然，結尾由袁隆平擴展至所有科學工作者，也稍為分散焦點。建議按「背景—關鍵事跡—成果與影響—我的啟發和行動」安排，壓縮原理介紹，增設由事件轉向感悟的過渡句，令中心更集中。\"},{\"name\":\"標點字體\",\"score\":\"6／10\",\"comment\":\"書寫表現良好，字跡清楚易讀，標點運用得宜，是一份乾淨整齊的卷面。\"}],\"commentary\":[{\"label\":\"原總評\",\"markdown\":\"文章選取袁隆平及其雜交水稻研究，能扣住對當代中國有貢獻的人物，並指出堅持不懈、珍惜糧食等啟發。惟全文較像人物與科技知識簡介，三系雜交水稻的原理佔幅過多，袁隆平面對困難、反覆試驗的具體過程則寫得簡略，因而人物形象和感染力不足。最需要改善的是以典型事件和細節呈現其精神，再由事跡自然引出個人感悟與實踐方向。\"}]},\"revision\":{\"title\":\"修改示範\",\"fields\":[{\"label\":\"修改維度\",\"markdown\":\"表達　｜　原得分：12／30\"},{\"label\":\"原文片段\",\"markdown\":\"\u003e 但雖獨有一位，他讓無數中國平民百姓吃到飽飯。\"},{\"label\":\"問題說明\",\"markdown\":\"語法錯誤且用詞不當。「但雖獨有」搭配混亂，語意不通；「吃到飽飯」口語化嚴重，不符合書面語體。\"},{\"label\":\"修改示範\",\"markdown\":\"**教學示範，非學生原文**\\n\\n改為「然而，其中有一位科學家，讓無數中國百姓擺脫了飢餓。」\"},{\"label\":\"修改建議\",\"markdown\":\"修正關聯詞搭配，提升用詞的書面語色彩。\"}]}}},\"4.4\":{\"id\":\"4.4\",\"title\":\"改進案例｜案例四\",\"parentId\":\"4\",\"children\":[],\"markdown\":\"並列介紹三位人物，未聚焦題目要求的一位人物，可用於分析選材集中與中心統一。\",\"caseStudy\":{\"essay\":{\"title\":\"習作全文\",\"markdown\":\"現時的中國發展蓬勃，有不少  \\n出色的名人都紛紛帶動着社會發展  \\n的速度，你一定有從哪些地方聽聞  \\n過孫中山這個名字，他被大眾尊稱  \\n為「國父」，那麼為甚麼他那麼受大  \\n眾舉捧呢？這正是因為當時他奮力  \\n推翻了腐敗的清朝政府，隨後還組  \\n織了興中會和同盟會，並且積極在  \\n海內籌款和發動起義，雖然他經歷  \\n了十次的起義失敗，但我非常欣賞  \\n他永不放棄的精神，也喜歡他那正  \\n義的態度，正是因為孫中山先生一\\n\\n直以來倡導國民革命，手創出亞洲  \\n第一個民主共和國——中華民國，  \\n才結束了中國兩千年的封建君主專  \\n制。\\n\\n接下來，我們將要介紹的名人  \\n，就是我們的「雜交水稻之父」，你  \\n可能未必知道這是誰人，但你一定  \\n聽聞過袁隆平這個熟悉的名字，在  \\n很久以前出現了大饑荒，人們因為  \\n沒有足夠和豐滿的糧食，只能挨餓  \\n，加上那時候的年代並沒有現代這  \\n麼充實，所以那時的人們可以説是  \\n在噩夢當中渡過，但非常幸運的是  \\n，社會的糧食問題得到了袁隆平爺  \\n爺的幫助，才解決了大饑荒的問題  \\n，他就是那位「雜交水稻之父」是  \\n他花費了很多心血的功勞，如今我  \\n們所吃到的新鮮米飯，就是我們那  \\n偉大的袁隆平先生，你可曾聽聞過\\n\\n一首詩中的一句「粒粒皆辛苦」，意  \\n思是指米飯得來並不易，所以我們  \\n也要珍惜當下的糧食，珍惜我們現  \\n今擁有的一切啊！\\n\\n不但是在社會方面發展蓬勃，  \\n在運動方面也气人值得欣賞，就比  \\n如説奧運會的跳水天才——全紅嬋  \\n，别以為她只是一位運動天賦高的  \\n女孩，其實她心中也有一颗勤奮的  \\n心，就像一顆檸檬的糖果，甜中帶  \\n點酸澀，甚至有一小股苦味，她之  \\n所以這麼努力，正是因為她為3拿  \\n到錢去治好母親的病，如今我們在  \\n電視上看到的她，就是她努力過後  \\n的志氣，給觀眾帶來一場熱烈的奧  \\n運會。\\n\\n隨着社會各種方面的進展，祖  \\n國也正在慢慢不斷強大呢！\"},\"assessment\":{\"title\":\"原評分與評語\",\"total\":\"總分：34／100\",\"dimensions\":[{\"name\":\"內容\",\"score\":\"11／40\",\"comment\":\"選材涉及政治、農業和體育人物，能大致指出他們的貢獻，部分內容也與人物品德相連，例如由孫中山多次起義失敗寫到「永不放棄」，由袁隆平的水稻研究帶出珍惜糧食。不過，文章沒有依題意選定「一位」人物，而是依次介紹三人，中心因而分散。事跡多以概述和評價為主，缺少關鍵場景、行動過程及具體細節，未充分呈現「感人或傑出」之處；對全紅嬋的敘述尤其簡略。啟發部分亦多停留在品德標籤或一般勸勉，尚未具體交代這些精神如何改變「我」的想法和行動。\"},{\"name\":\"表達\",\"score\":\"11／30\",\"comment\":\"文章語氣直接，能運用設問和比喻嘗試吸引讀者，如以糖果的「甜中帶點酸澀」形容全紅嬋的經歷。不過，部分用詞和搭配不夠準確，例如「足夠和豐滿的糧食」、「運動方面也气人值得欣賞」、「努力過後的志氣」等，影響語意清晰；「你一定聽聞過」等第二人稱說法反覆出現，也使敘述較像口頭介紹。部分句子過長，因果關係含混，且有語句殘缺或雜入字符的情況，如「她為3拿到錢」，令內容難以理解。宜改用準確、簡潔的敘述，並以人物的動作、語言和處境代替籠統讚美。\"},{\"name\":\"結構\",\"score\":\"7／20\",\"comment\":\"文章大致採用開頭引入、分段介紹人物、結尾總結的安排，各人物各佔一段，段落界線尚算清楚。然而，三個人物之間只是以「接下來」和「不但是」串聯，缺乏共同中心和遞進關係，篇章較像人物資料的並列羅列。各段內部亦未形成完整的事件脈絡，背景、困難、行動、結果和感悟沒有充分展開。結尾只概括祖國強大，未回扣某位人物的事跡、品德及「我」的啟發，首尾聯繫較弱。\"},{\"name\":\"標點字體\",\"score\":\"5／10\",\"comment\":\"卷面整潔美觀，字跡清晰易讀，標點運用得當，展現出良好的書寫習慣。\"}],\"commentary\":[{\"label\":\"原總評\",\"markdown\":\"文章能列舉孫中山、袁隆平和全紅嬋的貢獻或經歷，並提及永不放棄、珍惜糧食和勤奮等感受。然而，題目要求聚焦一位人物，本文卻分寫三人，未能集中記述一件感人或傑出的事跡；各人物的介紹亦較概括，個人啟發和實踐方向不足。最需要改善的是鎖定單一人物，以具體事件和細節呈現其品德，再深入說明對「我」的影響。\"}]},\"revision\":{\"title\":\"修改示範\",\"fields\":[{\"label\":\"修改維度\",\"markdown\":\"表達　｜　原得分：11／30\"},{\"label\":\"原文片段\",\"markdown\":\"\u003e 人們因為沒有足夠和豐滿的糧食，只能挨餓，加上那時候的年代並沒有現代這麼充實\"},{\"label\":\"問題說明\",\"markdown\":\"用詞不當。「豐滿」通常形容人體或鳥類羽毛，不能用來修飾「糧食」；「年代沒有現代這麼充實」搭配奇怪，語意不明。\"},{\"label\":\"修改示範\",\"markdown\":\"**教學示範，非學生原文**\\n\\n改為「人們因為糧食短缺，只能挨餓，加上當時物資匱乏，生活艱難」。\"},{\"label\":\"修改建議\",\"markdown\":\"更換準確的形容詞，並理清句子邏輯，使表達符合書面語規範。\"}]}}},\"2.3\":{\"id\":\"2.3\",\"title\":\"立意與內容展開\",\"parentId\":\"2\",\"children\":[\"2.3.1\",\"2.3.2\",\"2.3.3\",\"2.3.4\",\"2.3.5\"],\"markdown\":\"\"},\"2.3.1\":{\"id\":\"2.3.1\",\"title\":\"事迹支撐\",\"parentId\":\"2.3\",\"children\":[],\"markdown\":\"\",\"exercise\":{\"question\":\"以下哪些片段能以具體事迹支撐人物的貢獻或影響力，並呈現其感人或傑出之處？\",\"options\":[{\"label\":\"A\",\"text\":\"終於在二零二一年東京奧運百米總決賽中，他跑出九秒八三的佳績，創下了亞洲紀錄。\"},{\"label\":\"B\",\"text\":\"這種水稻植株沒辦法自行授粉，但可以接受其他水稻的花粉來結籽；因為不會自己授粉，培育出來的雜交種子純度會更高。\"}],\"answers\":[\"A\"],\"comments\":[{\"label\":\"A\",\"text\":\"以比賽成績與亞洲紀錄交代具體成就，支撐人物在體育領域的貢獻。\"},{\"label\":\"B\",\"text\":\"此段為雜交水稻的技術特性說明，並不是記敘人物的具體事迹，不能展現人物的感人或傑出之處，不符合記敘文寫作要求。\"}]}},\"2.3.2\":{\"id\":\"2.3.2\",\"title\":\"細節與感染力\",\"parentId\":\"2.3\",\"children\":[],\"markdown\":\"\",\"exercise\":{\"question\":\"以下哪些片段能以生動細膩的描寫呈現事迹，增強文章的感染力？\",\"options\":[{\"label\":\"A\",\"text\":\"離心機啟動時，強大的壓力會壓迫身體，胸口彷彿壓着巨石，使她呼吸困難，但她依然咬緊牙關繼續堅持。\"},{\"label\":\"B\",\"text\":\"在二零二四年巴黎奧運會一百米自由泳比賽，潘展樂奪得金牌，造出四十六秒四的成績，刷新自己保持的世界紀錄，較第二名快了一點零八秒。\"}],\"answers\":[\"A\"],\"comments\":[{\"label\":\"A\",\"text\":\"運用比喻及身體感受描寫，具體呈現訓練的艱辛，比單純說「訓練很辛苦」更具感染力。\"},{\"label\":\"B\",\"text\":\"只列舉比賽結果與數據，沒有描寫比賽過程、人物狀態或現場氣氛，較難令讀者產生共鳴。\"}]}},\"2.3.3\":{\"id\":\"2.3.3\",\"title\":\"事迹與啟發的關聯\",\"parentId\":\"2.3\",\"children\":[],\"markdown\":\"\",\"exercise\":{\"question\":\"以下哪些片段能從人物事迹自然引出啟發或品德，使前後邏輯通順？\",\"options\":[{\"label\":\"A\",\"text\":\"對比屠呦呦面對數百次實驗失敗仍持續鑽研，我明白自己不該輕易退縮。\"},{\"label\":\"B\",\"text\":\"他入選「浙江青年五四獎章」擬表彰名單，由此可見，他為國家作出不少貢獻。\"}],\"answers\":[\"A\"],\"comments\":[{\"label\":\"A\",\"text\":\"把人物屢敗仍堅持研究的行為，連繫到自己不應輕易退縮的感悟，兩者關聯清晰。\"},{\"label\":\"B\",\"text\":\"只概括人物的貢獻，沒有帶出個人的反思與啟示，令事迹和感悟之間邏輯斷開。\"}]}},\"2.3.4\":{\"id\":\"2.3.4\",\"title\":\"個人啟發\",\"parentId\":\"2.3\",\"children\":[],\"markdown\":\"\",\"exercise\":{\"question\":\"以下哪些片段能結合具體的個人經驗，呈現具有個人獨特性的啟發？\",\"options\":[{\"label\":\"A\",\"text\":\"練習扣球時，我總是掌握不好力度與起跳時機，屢次扣球出界，一度想放棄訓練。\"},{\"label\":\"B\",\"text\":\"這句話是想說米飯得來不易，所以我們要珍惜糧食，珍惜現在所擁有的一切。\"}],\"answers\":[\"A\"],\"comments\":[{\"label\":\"A\",\"text\":\"以自己練排球遇到的困難作為個人經歷，配合從人物精神得到的反思，感悟貼合自身處境。\"},{\"label\":\"B\",\"text\":\"啟示是很常見的勸勉，沒有和自己的成長經歷結合，內容比較空泛俗套。\"}]}},\"2.3.5\":{\"id\":\"2.3.5\",\"title\":\"值得學習的品德\",\"parentId\":\"2.3\",\"children\":[],\"markdown\":\"\",\"exercise\":{\"question\":\"以下哪些片段明確指出了人物值得學習的具體品德？\",\"options\":[{\"label\":\"A\",\"text\":\"首先是堅韌不拔的意志，面對無數次實驗失敗與外界質疑，她百折不撓，始終固守初心，不被挫折磨滅信念。\"},{\"label\":\"B\",\"text\":\"當今有不少游泳運動員為國家爭光，潘展樂是其中一位，同時也是一百米自由泳世界紀錄保持者。\"}],\"answers\":[\"A\"],\"comments\":[{\"label\":\"A\",\"text\":\"透過她面對失敗仍堅持不懈的表現，說明堅毅的品德。\"},{\"label\":\"B\",\"text\":\"只介紹人物身份和成績，沒有歸納出值得學習的具體品德。\"}]}},\"3.1\":{\"id\":\"3.1\",\"title\":\"表達\",\"parentId\":\"3\",\"children\":[\"3.1.2\"],\"markdown\":\"\"},\"3.1.2\":{\"id\":\"3.1.2\",\"title\":\"語言表達\",\"parentId\":\"3.1\",\"children\":[],\"markdown\":\"\",\"exercise\":{\"question\":\"以下哪些片段語言流暢、用詞準確，能清晰地表達人物事迹？\",\"options\":[{\"label\":\"A\",\"text\":\"屠呦呦最偉大的成就，便是研發青蒿素，拯救全球千萬人的生命。\"},{\"label\":\"B\",\"text\":\"當時瘧疾肆虐，研究條件十分艱苦，為測試青蒿素的效用與安全，她和團隊甚至以身試藥，承受巨大健康風險。\"},{\"label\":\"C\",\"text\":\"航天員的訓練遠比我們想像中的還要艱辛，為了應付太空任務。\"}],\"answers\":[\"A\",\"B\"],\"comments\":[{\"label\":\"A、B\",\"text\":\"語言流暢，用詞準確，能清晰有力地表達人物事迹。\"},{\"label\":\"C\",\"text\":\"句子並未寫完，語意殘缺，影響行文流暢度。\"}]}},\"3.2\":{\"id\":\"3.2\",\"title\":\"結構分析\",\"parentId\":\"3\",\"children\":[\"3.2.1\",\"3.2.3\"],\"markdown\":\"\"},\"3.2.1\":{\"id\":\"3.2.1\",\"title\":\"篇章完整與收束\",\"parentId\":\"3.2\",\"children\":[],\"markdown\":\"\",\"exercise\":{\"question\":\"以下哪些結尾能扣住所寫人物及主要意思，完成篇章的收束？\",\"options\":[{\"label\":\"A\",\"text\":\"往後，我會以屠呦呦作為自己的榜樣。在學習和面對生活挑戰時，倘若遭遇困難或失敗，我要提醒自己不要輕易放棄，學習她的堅毅與無私，踏實累積實力，期望日後也能盡己所能，為身邊的人、為社會貢獻屬於自己的一份力量。\"},{\"label\":\"B\",\"text\":\"隨着社會各方面持續發展，我們的祖國正不斷變得強盛。\"}],\"answers\":[\"A\"],\"comments\":[{\"label\":\"A\",\"text\":\"結尾回到屠呦呦作為榜樣以及自己的學習方向，回應文章敬佩與學習的主旨。本題只評收束效果，不代表整篇文章結構完美。\"},{\"label\":\"B\",\"text\":\"結尾轉到國家發展的宏大概括，沒有扣緊文中人物事迹和個人感悟。\"}]}},\"3.2.3\":{\"id\":\"3.2.3\",\"title\":\"事迹與思考的銜接\",\"parentId\":\"3.2\",\"children\":[],\"markdown\":\"\",\"exercise\":{\"question\":\"以下哪些片段能自然銜接人物事迹與個人思考，使由事及理的轉換清楚？\",\"options\":[{\"label\":\"A\",\"text\":\"屠呦呦永不言敗的精神，讓我想起排球的經歷。\"},{\"label\":\"B\",\"text\":\"接下來，我們將要介紹的名人，就是我們的「雜交水稻之父」\"}],\"answers\":[\"A\"],\"comments\":[{\"label\":\"A\",\"text\":\"以人物精神作承接，從人物事迹轉向自身排球經歷，轉換對象清楚。\"},{\"label\":\"B\",\"text\":\"使用機械的廣播式過渡語，且前後段落講述不同人物，導致結構鬆散，缺乏內在脈絡貫穿。\"}]}},\"1.2.3\":{\"id\":\"1.2.3\",\"title\":\"班際對比\",\"parentId\":\"1.2\",\"children\":[],\"markdown\":\"\",\"kind\":\"class-comparison\"},\"1.2.4\":{\"id\":\"1.2.4\",\"title\":\"本班與年級對比\",\"parentId\":\"1.2\",\"children\":[],\"markdown\":\"\",\"kind\":\"grade-comparison\"}},\"sectionAliases\":{\"4.1.1\":\"4.1\",\"4.1.2\":\"4.1\",\"4.1.3\":\"4.1\",\"4.2.1\":\"4.2\",\"4.2.2\":\"4.2\",\"4.2.3\":\"4.2\",\"4.3.1\":\"4.3\",\"4.3.2\":\"4.3\",\"4.3.3\":\"4.3\",\"4.4.1\":\"4.4\",\"4.4.2\":\"4.4\",\"4.4.3\":\"4.4\"},\"comparison\":{\"schemaVersion\":\"score-comparison-v1\",\"gradeName\":\"全年級\",\"currentClassId\":\"a\",\"classes\":[{\"id\":\"a\",\"name\":\"A班\",\"sampleCount\":32,\"distributions\":{\"total\":[0,0,6,25,1],\"content\":[0,2,12,18,0],\"wording\":[0,0,2,22,8],\"structure\":[0,0,5,27,0],\"mechanics\":[0,0,0,1,31]},\"summaries\":{\"total\":{\"min\":45,\"max\":81,\"sum\":2106},\"content\":{\"min\":11,\"max\":31,\"sum\":755},\"wording\":{\"min\":15,\"max\":25,\"sum\":664},\"structure\":{\"min\":8,\"max\":15,\"sum\":398},\"mechanics\":{\"min\":7,\"max\":10,\"sum\":289}}},{\"id\":\"b\",\"name\":\"B班\",\"sampleCount\":34,\"distributions\":{\"total\":[0,0,10,23,1],\"content\":[0,4,9,20,1],\"wording\":[0,0,9,21,4],\"structure\":[0,1,9,24,0],\"mechanics\":[0,0,0,1,33]},\"summaries\":{\"total\":{\"min\":41,\"max\":80,\"sum\":2163},\"content\":{\"min\":10,\"max\":33,\"sum\":785},\"wording\":{\"min\":14,\"max\":25,\"sum\":662},\"structure\":{\"min\":5,\"max\":14,\"sum\":411},\"mechanics\":{\"min\":6,\"max\":10,\"sum\":305}}},{\"id\":\"c\",\"name\":\"C班\",\"sampleCount\":36,\"distributions\":{\"total\":[0,0,5,30,1],\"content\":[0,1,13,20,2],\"wording\":[0,0,2,25,9],\"structure\":[0,0,5,30,1],\"mechanics\":[0,0,0,0,36]},\"summar
