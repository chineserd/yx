<!doctype html><html lang="zh-Hant"><head>
<meta name="robots" content="noindex, nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>每月新增素材標識</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"PingFang TC",sans-serif;background:#eef1f5;color:#303030}.shell{height:48px;display:flex;align-items:center;padding:0 16px;background:white;border-bottom:1px solid #e2e8f0;gap:24px;white-space:nowrap;overflow:auto;position:fixed;inset:0 0 auto;z-index:10;font-size:12px}.name{border-left:3px solid #5478e8;padding-left:11px;line-height:18px;color:#334155}.name small{display:block;font-size:10px;line-height:14px;letter-spacing:1px;color:#8793a5}.shell a{margin-left:auto;color:#65758b}.active{align-self:stretch;display:flex;align-items:center;border-bottom:2px solid #3563ff;padding:0 12px;color:#3563ff;background:#f5f8ff}.stage{padding:68px 16px 24px;display:flex;justify-content:center}.phone{width:390px;max-width:100%;background:#f8f8f8;border-radius:24px;overflow:hidden;box-shadow:0 12px 40px #1e37521a}.blue{color:white;background:radial-gradient(ellipse at 105% 100%,#497ff8 0 55%,transparent 55%),linear-gradient(130deg,#346ef4,#4a80fa);padding:20px 16px 12px}.status{display:flex;justify-content:space-between;font-weight:600;padding:0 22px 28px;font-size:16px}.heading{display:flex;align-items:center;justify-content:space-between;font-size:18px;padding:4px 2px 28px}.tabs{display:flex;gap:24px;align-items:center;font-size:18px}.tabs .selected{font-weight:600;border-bottom:3px solid white;padding-bottom:10px}.tabs .muted{opacity:.55;padding-bottom:10px}.tabs .right{margin-left:auto;font-size:14px;padding-bottom:10px}.body{padding:16px;background:#f8f8f8;border-radius:18px 18px 0 0;margin-top:-2px}.filters{display:flex;justify-content:space-between;gap:8px;margin-bottom:14px;font-size:14px;align-items:center}.pill{background:#e8efff;color:#346dff;padding:10px 14px;border-radius:24px;white-space:nowrap}.pill.gray{color:#777;background:#eff0f2}.card:focus-visible{outline:2px solid #3563ff;outline-offset:2px}dialog{border:0;border-radius:16px;padding:24px;color:#303030}dialog button{min-height:44px}dialog::backdrop{background:#172b3a66}.card{cursor:pointer;background:#fff;border-radius:18px;margin-bottom:16px;padding:22px 18px 20px;box-shadow:0 5px 0 #ffffff80}.titleline{display:flex;align-items:center;gap:8px;min-height:34px}.title{font-size:22px;font-weight:600;line-height:1.5;overflow-wrap:anywhere}.new{display:inline-flex;align-items:center;justify-content:center;background:#e92e3b;color:white;font-size:12px;font-weight:500;line-height:20px;width:24px;height:20px;border-radius:4px;vertical-align:middle;margin-left:6px;white-space:nowrap}.arrow{margin-left:auto;flex-shrink:0;color:#00b4ed;background:#edf3ff;border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-weight:700}.meta{border-top:1px solid #f0f0f0;margin-top:25px;padding-top:20px;display:flex;justify-content:space-between;align-items:center;font-size:15px;color:#777;gap:8px}.type{color:#3675fc;background:#d8f2ff;font-size:14px;border-radius:4px;padding:2px 8px;white-space:nowrap}.home{height:22px;display:grid;place-items:center;background:white}.home:after{content:"";width:130px;height:5px;border-radius:5px;background:black}.wrap{max-width:100%}@media(max-width:430px){.stage{padding:60px 8px 16px}.filters{gap:4px;font-size:13px}.pill{padding:10px}.title{font-size:21px}}
</style><script id="github-pages-prototype-redirect">if(location.hostname==="chineserd.github.io")location.replace("https://chineserd-prototypes.pages.dev"+location.pathname+location.search+location.hash);</script>
</head><body><header class="shell"><div class="name"><small>需求名稱</small><b>每月新增素材標識</b></div><span class="active">App 效果稿</span><a style="margin-left:0" href="prd.html">PRD</a><a style="margin-left:0" href="api.html">接口說明</a><a href="../">歷史需求彙總頁</a></header><main class="stage"><div class="wrap"><section class="phone" aria-label="發音評測素材列表效果稿"><div class="blue"><div class="status"><span>18:49</span><span>▮▮▮ ﹏ ▰</span></div><div class="heading"><span>〈</span><span>發音評測</span><span>P1⌄</span></div><div class="tabs"><span class="selected">公共</span><span class="muted">校本</span><span class="muted">合集</span><span class="right">錯字集 ◷</span></div></div><div class="body"><div class="filters"><span class="pill">課外誦材</span><span class="pill gray">綜合練習</span><span class="pill">誦材類型：全部⌄</span></div><div id="cards"></div></div><div class="home"></div></section></div></main><dialog id="detail"><h2 id="detail-title"></h2><p>古詩詞</p><form method="dialog"><button>返回素材列表</button></form></dialog><script>
const data=[['《長歌行》','56.9',true],['《池上》','7.7',true],['《春曉》',null,false],['《風》',null,false]];const viewed=new Set(JSON.parse(localStorage.getItem("new-material-viewed")||"[]"));function render(){document.querySelector('#cards').innerHTML=data.map(([name,score,isNew],i)=>`<article class="card" tabindex="0" role="button" data-id="${i}" aria-label="查看${name}"><div class="titleline"><div class="title">${name}${isNew&&!viewed.has(i)?'<span class="new" aria-label="新素材">新</span>':''}</div><span class="arrow" aria-hidden="true">›</span></div><div class="meta"><span class="type">古詩詞</span>${score!==null?`<span>上次成績：${score}</span>`:''}</div></article>`).join('')}render();document.querySelector('#cards').onclick=e=>{const card=e.target.closest('[data-id]');if(!card)return;const i=Number(card.dataset.id);viewed.add(i);localStorage.setItem('new-material-viewed',JSON.stringify([...viewed]));render();document.querySelector('#detail-title').textContent=data[i][0];document.querySelector('#detail').showModal()};document.querySelector('#cards').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.target.click()}};</script></body></html>
