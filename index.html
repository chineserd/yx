<script>
(() => {
  const credentialHash = '1098f2c75a3400b68f7e44c2683fc7ff9c33f019b3b03fe26e816aa504aefec1';
  const storageKey = 'chineserd-public-home-session';
  const form = document.getElementById('home-login-form');
  const username = document.getElementById('home-username');
  const password = document.getElementById('home-password');
  const error = document.getElementById('home-login-error');
  const normalizedCredential = value => value.replace(/[\s\u3000]/g, '');
  if (!document.documentElement.classList.contains('auth-locked')) return;
  document.getElementById('home-logout').hidden = false;
  const unlock = () => {
    document.documentElement.classList.remove('auth-locked');
    password.value = '';
  };
  try {
    const saved = JSON.parse(localStorage.getItem(storageKey) || 'null');
    if (saved && saved.version === credentialHash && saved.expiresAt > Date.now()) unlock();
  } catch (_) { /* Storage may be unavailable; the form still works. */ }
  async function matches() {
    const value = `${normalizedCredential(username.value)}\n${normalizedCredential(password.value)}`;
    const bytes = new TextEncoder().encode(value);
    const digest = await crypto.subtle.digest('SHA-256', bytes);
    return Array.from(new Uint8Array(digest), byte => byte.toString(16).padStart(2, '0')).join('') === credentialHash;
  }
  async function login(showError) {
    if (!normalizedCredential(username.value) || !normalizedCredential(password.value)) return;
    if (await matches()) {
      try { localStorage.setItem(storageKey, JSON.stringify({ version: credentialHash, expiresAt: Date.now() + 30 * 86400_000 })); } catch (_) {}
      error.hidden = true;
      unlock();
    } else if (showError) {
      error.hidden = false;
    }
  }
  form.addEventListener('submit', event => { event.preventDefault(); login(true); });
  let lastValues = '';
  const autoLogin = () => {
    const values = `${username.value}\n${password.value}`;
    if (values !== lastValues) {
      lastValues = values;
      error.hidden = true;
      login(false);
    }
  };
  username.addEventListener('input', autoLogin);
  password.addEventListener('input', autoLogin);
  const fillTimer = setInterval(() => {
    if (!document.documentElement.classList.contains('auth-locked')) { clearInterval(fillTimer); return; }
    autoLogin();
  }, 250);
  setTimeout(() => clearInterval(fillTimer), 6000);
  document.getElementById('home-logout').addEventListener('click', () => {
    try { localStorage.removeItem(storageKey); } catch (_) {}
    location.reload();
  });
})();
</script>
<script>
const STATUS_LABEL = {
  "in-progress": "开发中",
  "review":      "评审中",
  "delivered":   "已交付",
  "launched":    "已上线",
  "designing":   "设计中",
  "archived":    "已归档"
};

const BUSINESS_CATEGORIES = ['普通话科', '中文科', '中文路', 'DSE'];
const HISTORY_PROJECTS = ['中文科', '中文路'];
const CATEGORY_COLORS = ['#7097be', '#7b9d8b', '#b19a72', '#9789b7', '#94a3b8'];
function businessCategory(item) {
  const pathCategory = (item.localSource || '').split('/')[1];
  if (BUSINESS_CATEGORIES.includes(pathCategory)) return pathCategory;
  return BUSINESS_CATEGORIES.includes(item.businessCategory) ? item.businessCategory : '未分类';
}
function categoryOrder(items) {
  const names = new Set(items.filter(item => !item.hidden).map(businessCategory));
  return [...names].sort((a, b) => {
    if (a === '未分类') return 1;
    if (b === '未分类') return -1;
    return a.localeCompare(b, 'zh-CN');
  });
}
let config = null;
let searchQuery = "";
let historyProject = 'all';

function historyProjectFor(item) {
  const parts = (item.localSource || '').split('/');
  return parts[0] === '04 迭代记录' && HISTORY_PROJECTS.includes(parts[2]) ? parts[2] : '未分类';
}

async function load() {
  const res = await fetch("menu-config.json", { cache: "no-cache" });
  config = await res.json();
  const order = ['ready-development', 'in-review', 'pending-review', 'iteration-history'];
  const rank = g => order.includes(g.id) ? order.indexOf(g.id) : order.length;
  config.groups = config.groups.map(g => ({ ...g, expanded: g.expanded === true }))
    .sort((a, b) => rank(a) - rank(b));
  config.groups.forEach(g => { if (['ready-development', 'pending-review'].includes(g.id)) g.categoryOrder = categoryOrder(g.items); });
  render();
  window.dispatchEvent(new CustomEvent("prototype-config", {detail:config}));
}

function render() {
  renderTimeline();
}

function requirementDate(item) {
  return /^\d{4}-\d{2}-\d{2}/.test(item.createdAt || "") ? item.createdAt : "";
}
function requirementTitle(item) {
  return item.folderName || item.title;
}
function newestFirst(a, b) {
  return requirementDate(b).localeCompare(requirementDate(a));
}
function folderNameFirst(a, b) {
  return requirementTitle(a).localeCompare(requirementTitle(b), 'zh-CN', { numeric: true });
}

function matchesFilter(item) {
  // 临时隐藏的需求不出现在目录或搜索结果中；保留配置便于恢复。
  if (item.hidden === true) return false;
  // 仅按卡片实际显示的需求标题搜索。
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    if (!requirementTitle(item).toLowerCase().includes(q)) return false;
  }
  return true;
}

function renderGroupItems(group) {
  if (!group.items.length) return `<p class="req-subtitle">暂无原型</p>`;
  if (['ready-development', 'pending-review'].includes(group.id)) {
    const categories = group.categoryOrder || categoryOrder(group.items);
    return `<div class="category-grid">${categories.map(name => {
      const items = group.items.filter(item => businessCategory(item) === name);
      if (!items.length) return '';
      const color = CATEGORY_COLORS[BUSINESS_CATEGORIES.includes(name) ? BUSINESS_CATEGORIES.indexOf(name) : 4];
      return `<section class="category-panel" aria-label="${name}" style="--category-color:${color}">
        <h2 class="category-title"><span class="category-dot" aria-hidden="true"></span>${name}<span class="category-count">${items.length} 项</span></h2>
        <div class="req-grid">${items.map(renderCard).join('')}</div>
      </section>`;
    }).join('')}</div>`;
  }
  if (group.id !== 'iteration-history') {
    return `<div class="req-grid">${group.items.map(renderCard).join('')}</div>`;
  }
  const filters = `<div class="history-project-filter" role="group" aria-label="按项目筛选迭代记录">${[
    ['all', '全部项目'], ...HISTORY_PROJECTS.map(name => [name, name])
  ].map(([value, label]) => `<button type="button" data-history-project="${value}" aria-pressed="${historyProject === value}">${label}</button>`).join('')}</div>`;
  const months = new Map();
  for (const item of group.items) {
    const month = (item.localSource || '').split('/')[1];
    const key = /^\d{4}\.\d{2}$/.test(month || '') ? month : '未分类';
    if (!months.has(key)) months.set(key, []);
    months.get(key).push(item);
  }
  return filters + ([...months.keys()].sort((a, b) => b.localeCompare(a)).map(month => `
    <details class="month-group" open>
      <summary>${month} · ${months.get(month).length} 项</summary>
      <div class="history-category-list">${[...HISTORY_PROJECTS, '未分类'].map(project => {
        const items = months.get(month).filter(item => historyProjectFor(item) === project);
        return items.length ? `<details class="history-category" open>
          <summary>${project} · ${items.length} 项</summary>
          <div class="req-grid">${items.sort(newestFirst).map(renderCard).join('')}</div>
        </details>` : '';
      }).join('')}</div>
    </details>`).join('') || '<p class="req-subtitle">该项目暂无迭代记录</p>');
}

const cardResizeObserver = new ResizeObserver(entries => {
  for (const entry of entries) fitCardTitle(entry.target);
});
function fitCardTitle(card) {
  const title = card.querySelector('.req-title');
  if (!title || !title.clientWidth) return;
  title.style.display = 'block';
  title.style.maxHeight = 'none';
  title.style.fontSize = '16px';
  // Long titles become smaller before the final two-line ellipsis.
  if (title.scrollHeight > 22) title.style.fontSize = '14px';
  for (let size = 13; title.scrollHeight > 43 && size >= 12; size--) {
    title.style.fontSize = `${size}px`;
  }
  title.style.display = '';
  title.style.maxHeight = '';
  title.title = title.textContent;
}

function renderTimeline() {
  cardResizeObserver.disconnect();
  const wrap = document.getElementById("timeline");
  const matchedGroups = config.groups
    .map(g => ({ ...g, items: g.items.filter(item => matchesFilter(item) &&
      (g.id !== 'iteration-history' || historyProject === 'all' || historyProjectFor(item) === historyProject)).sort(
      ['ready-development', 'pending-review'].includes(g.id) ? folderNameFirst : newestFirst
    ) }))
    .filter(g => !g.hidden && (g.items.length > 0 || (g.showEmpty && !searchQuery)));

  if (matchedGroups.length === 0) {
    wrap.innerHTML = `<div class="empty">
      <div class="empty-icon">📭</div>
      没有匹配的需求。试试调整搜索词。
    </div>`;
    return;
  }

  wrap.innerHTML = matchedGroups.map(g => {
    const itemsHtml = renderGroupItems(g);
    return `
      <section class="time-group ${g.expanded ? "expanded" : ""} color-${g.color || "blue"}" data-group-id="${g.id}">
        <div class="time-head" onclick="toggleGroup(this.parentElement)">
          <span class="caret">▶</span>
          <span class="time-title">
            ${g.title}
            <span class="badge">${g.items.length} 项</span>
          </span>
          <span class="time-meta">${g.subtitle}</span>
        </div>
        <div class="time-body">
          ${itemsHtml}
        </div>
      </section>
    `;
  }).join("");
  wrap.querySelectorAll(".req-card").forEach(card => cardResizeObserver.observe(card));
  wrap.querySelectorAll("[data-history-project]").forEach(button => button.addEventListener("click", () => {
    historyProject = button.dataset.historyProject;
    renderTimeline();
  }));
}

function toggleGroup(group) {
  group.classList.toggle("expanded");
  const source = config.groups.find(item => item.id === group.dataset.groupId);
  if (source) source.expanded = group.classList.contains("expanded");
}

function renderCard(item) {
  const previewDisabled = !item.previewUrl || item.previewUrl === "#";
  const previewHtml = previewDisabled
    ? `<span class="req-link disabled">原型未上传</span>`
    : `<a class="req-link primary" href="${item.previewUrl}" target="_blank">原型 ↗</a>`;

  return `
    <div class="req-card">
      <div class="req-card-head">
        <h3 class="req-title">${requirementTitle(item)}</h3>
        ${previewHtml}
      </div>
      <div class="req-meta">更新 ${item.updatedAt}</div>
    </div>
  `;
}

// 搜索框监听
document.getElementById("search").addEventListener("input", e => {
  searchQuery = e.target.value.trim();
  renderTimeline();
});

load().catch(() => { document.getElementById("requirements-sync").textContent="原型目录读取失败，请刷新重试。"; });
</script>
