<!doctype html><html lang="zh-Hant"><head>
<meta name="robots" content="noindex, nofollow"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>增加客戶收據及協議</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,"PingFang TC",sans-serif;color:#52647c;background:#f4f6fb}header{height:48px;display:flex;align-items:center;gap:16px;padding:0 16px;border-bottom:1px solid #e2e8f0;background:white;overflow-x:auto;white-space:nowrap}header strong{font-size:12px;line-height:18px;font-weight:600}header nav{display:flex;height:48px}header a{display:flex;align-items:center;padding:0 12px;color:#758298;text-decoration:none;font-size:12px;flex-shrink:0}header a[aria-current]{background:#f5f8ff;color:#3563ff;border-bottom:2px solid #3563ff;font-weight:600}header a:hover{background:#f5f8ff}header .history{margin-left:auto;text-decoration:underline;color:#65758b;padding:0}a:focus-visible,button:focus-visible{outline:2px solid #3563ff;outline-offset:-2px}#pages{position:fixed;top:60px;bottom:12px;left:8px;width:var(--rail,196px);padding:8px;background:white;border:1px solid #dce8f0;border-radius:10px;box-shadow:0 4px 16px #0f233709;overflow:auto}#pages section+section{border-top:1px solid #dce8f0;margin-top:6px;padding-top:6px}#pages h2{font-size:12px;line-height:18px;margin:0;min-height:28px;display:flex;align-items:center;white-space:nowrap;color:#526574}#pages ul{list-style:none;margin:0;padding:0 0 0 6px;border-left:1px solid #dce8f0}#pages button{font:12px/18px system-ui;min-height:28px;border:0;background:transparent;display:flex;gap:6px;align-items:center;width:100%;padding:4px 6px;border-radius:6px;text-align:left;white-space:nowrap;color:#526574;cursor:pointer}#pages button span{font-size:12px;color:#64748b}#pages button:hover{background:#eff5ff}#pages button[aria-current]{background:#dff2ff;color:#006d91;font-weight:600}#canvas{position:fixed;top:48px;right:0;bottom:0;left:calc(var(--rail,196px) + 16px);overflow:auto}iframe{display:block;width:100%;height:100%;border:0;min-width:1100px;background:white}body[data-surface=student] iframe{min-width:560px}body[data-surface=prd] #pages{display:none}body[data-surface=prd] #canvas{left:0}body[data-surface=prd] iframe{min-width:700px}#block{display:none;position:fixed;inset:48px auto 0 0;width:calc(var(--rail,196px) + 16px);background:#0f172a55;z-index:5}body.modal-open #block{display:none}@media(max-width:700px){header{padding:0 12px;gap:12px}#pages{left:6px;padding:7px}#canvas{left:calc(var(--rail,196px) + 14px)}}@media(pointer:coarse){#pages button{min-height:44px}}#pages li{list-style:none}body[data-surface=student] #canvas{overflow:hidden}</style><style>.requirement-identity.requirement-identity{position:relative;display:inline-flex;flex-direction:column;align-items:flex-start;justify-content:center;flex-shrink:0;gap:0;margin:0;padding:0 0 0 11px;border:0;border-radius:0;background:transparent;box-shadow:none;color:#334155;font:700 12px/18px -apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;white-space:nowrap;cursor:default;text-decoration:none}.requirement-identity::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:28px;border-radius:2px;background:#5478e8}.requirement-identity>.requirement-label{font:400 10px/14px -apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;letter-spacing:1px;color:#8793a5;cursor:default}.requirement-identity>.requirement-name{font:inherit;color:#334155;cursor:default}</style></head><body><header><span class="requirement-identity "><span class="requirement-label">需求名稱</span><span class="requirement-name">增加客戶收據及協議</span></span><nav aria-label="原型端口"><a href="#admin">後台</a><a href="#student">學生端（App）</a><a href="#prd">PRD</a><a href="#email">郵箱模板</a><a href="#service">服務協議</a><a href="#after-sales">售後政策</a></nav><a class="history" href="/">歷史需求彙總頁</a></header><nav id="pages" aria-label="頁面目錄"></nav><main id="canvas"><iframe title="增加客戶收據及協議內容"></iframe></main><div id="block"></div><script>const cfg={"pages": {"service":"./服務協議.html","after-sales":"./售後政策.html","email":"./邮箱发送内容模板.html","admin": "./admin.html", "student": "./student-app.html", "prd": "./PRD-收据申请发放及平台协议管理.html"}};
const frame=document.querySelector('#canvas iframe'),rail=document.querySelector('#pages');
let surface='',active='',observer,dirty=false;
const names={'移動端頁面入口':'收據與協議-學生端','學生 App 流程':'收據申請與查看','後端驗證':'收據與訂單詳情','移動端協議':'平台協議','后端页面':'學習報告-後台','后端：评语生成示例':'正式報告-評語','后端：学习报告 / 辅助态':'學習報告-詳情與課件','前端页面':'學習報告-學生端','后端页面入口':'收據與協議-後台','平台协议':'平台協議','收据凭证列表':'收據憑證','订单列表场景':'訂單列表','订单审核场景':'訂單審核','分享赠课':'分享贈課','弹窗验证':'收據與訂單詳情','學生 App 頁面入口':'收據與協議-學生端'};
function select(btn){rail.querySelectorAll('[aria-current]').forEach(x=>x.removeAttribute('aria-current'));if(btn)btn.setAttribute('aria-current','page')}
function route(){const key=location.hash.slice(1)||'admin';if(!cfg.pages[key])return; if(surface===key)return;
 if(dirty&&!confirm('目前有未儲存的編輯，是否離開？')){history.replaceState(null,'','#'+surface);return;}
 dirty=false;surface=key;document.body.dataset.surface=['email','service','after-sales'].includes(key)?'prd':key;rail.replaceChildren();document.querySelectorAll('header nav a').forEach(a=>a.toggleAttribute('aria-current',a.hash==='#'+key));frame.removeAttribute('style');frame.src=cfg.pages[key];fitApp();}
function mount(){if(observer)observer.disconnect();const doc=frame.contentDocument;if(!doc)return;
 document.body.classList.remove('modal-open');
 const style=doc.createElement('style');style.textContent='.dev-panel,.dev-toggle,.dev-nav,.prototype-nav{display:none!important}';doc.head.append(style);
 if(surface==='service'||surface==='after-sales'){frame.style.minWidth='0';return;}
 if(surface==='prd'||surface==='email'){
 const compact=doc.createElement('style');compact.textContent='body,body p,body li,body a,body span,body div,body h1,body h2,body h3,body h4,body th,body td,body code,body pre,body button{font-size:12px!important;line-height:1.6!important}h1,h2,h3,h4{margin:12px 0 8px!important}th,td{padding:6px 8px!important}.toc-link{padding-top:5px!important;padding-bottom:5px!important}';doc.head.append(compact);return;}
 if(surface==='student'){
 const appStyle=doc.createElement('style');appStyle.textContent='.student-prototype{display:flex!important;justify-content:center!important;padding:16px!important}.app-only-main{width:100%!important;margin:0!important;padding:16px!important}.app-single-stage{display:flex!important;justify-content:center!important}.account-phone{height:872px!important;min-height:872px!important;overflow:hidden}.app-screen{height:872px!important;min-height:872px!important}';doc.head.append(appStyle);fitApp();}

 doc.addEventListener('input',()=>dirty=true);
 const trigger=doc.querySelector('.dev-nav-trigger');if(trigger&&trigger.getAttribute('aria-expanded')!=='true')trigger.click();

 let lastPageKey=null,directorySelection=false;
 function syncSelection(force=false){
  let action='';
  const app=[...doc.querySelectorAll('[data-app-screen]:not([hidden])')].find(el=>el.getClientRects().length);
  if(app)action=({'account':'student-app-view','orders':'app-orders-view','order-confirm':'app-order-confirm-view','agreement':'app-agreement-view','agreement-detail':'app-agreement-detail'})[app.dataset.appScreen];
  else {const view=[...doc.querySelectorAll('[data-view]:not([hidden])')].find(el=>el.getClientRects().length);if(view)action=({'order-list':'order-list-view','receipt-audit':'receipt-audit-view','orders':'orders-view','platform-agreement':'agreement-view','share-gift':'share-gift-view'})[view.dataset.view];}
  if(doc.querySelector('.student-view-home'))action='学生 App 首页入口';
  if(doc.querySelector('.student-view-list'))action='AI學情分析列表';
  if(doc.querySelector('.student-view-detail'))action='正式报告详情';
  const admin=doc.querySelector('[data-preview-view]');
  if(admin){const {previewView:view,previewMode:mode,previewStatus:status}=admin.dataset;const group=mode==='班课';
   if(view==='list')action=status==='已发送'?(group?'学习报告列表 · 已发送班课':'学习报告列表 · 已发送'):(group?'学习报告列表 · 班课正式':'学习报告列表 · 待发送 1V1');
   if(view==='form')action=group?'班课正式报告填写':'正式报告填写';
   if(view==='detail')action=group?'班课正式报告查看':'查看正式报告';
   if(view==='courseware')action='课件管理列表';
  }
  if(action && directorySelection){lastPageKey=action;return;}
  if(action && (force||action!==lastPageKey)){const b=[...rail.querySelectorAll('button')].find(b=>b.dataset.action===action);if(b){select(b);b.scrollIntoView({block:'nearest'});lastPageKey=action;}}

 }
 function populate(){const sections=[...doc.querySelectorAll('.dev-section,.dev-nav-section')];if(!sections.length)return;
 rail.replaceChildren();
 for(const section of sections){const heading=section.querySelector('h3,:scope > span')?.textContent.trim()||'頁面';if(/跨端|移动端入口|資料工具|数据工具/.test(heading))continue;
 const buttons=[...section.querySelectorAll('button[data-dev-action],button.dev-nav-item,a.dev-nav-link')].filter(b=>!/(reset|export)/.test(b.dataset.devAction||''));if(!buttons.length)continue;
 const group=document.createElement('section'),h=document.createElement('h2'),list=document.createElement('ul');h.textContent=names[heading]||heading;group.append(h,list);
 buttons.forEach((source,i)=>{const text=source.querySelector('b')?.textContent.trim()||source.textContent.trim();const li=document.createElement('li'),b=document.createElement('button'),n=document.createElement('span');b.type='button';b.dataset.action=source.dataset.devAction||text;b.dataset.label=text;n.textContent=String(i+1).padStart(2,'0');b.append(n,document.createTextNode(text));b.onclick=()=>{directorySelection=true;if(source.tagName==='A'){const file=decodeURIComponent(new URL(source.href).pathname.split('/').pop());if(file==='邮箱发送内容模板.html'){location.hash='email';return;}if(file==='admin.html'){location.hash='admin';return;}if(file==='index.html'||file==='student-app.html'){location.hash='student';return;}}if(typeof frame.contentWindow.closeModal==='function')frame.contentWindow.closeModal();source.click();select(b);dirty=false;};li.append(b);list.append(li);});rail.append(group);}
 const home=[...rail.querySelectorAll('button')].find(b=>['student-app-view','学生 App 首页入口'].includes(b.dataset.action));
 if(home){const homeGroup=document.createElement('section'),title=document.createElement('h2');title.textContent='首頁';const homeList=document.createElement('ul');homeList.append(home.parentElement);homeGroup.append(title,homeList);rail.prepend(homeGroup);rail.querySelectorAll('ul').forEach(ul=>[...ul.querySelectorAll('button span')].forEach((n,i)=>n.textContent=String(i+1).padStart(2,'0')));}
 syncSelection();const measure=document.createElement('canvas').getContext('2d');const width=Math.ceil(Math.max(196,...[...rail.querySelectorAll('button,h2')].map(x=>{measure.font=x.tagName==='H2'?'600 12px system-ui':'600 12px system-ui';return measure.measureText(x.textContent).width+42;})));document.documentElement.style.setProperty('--rail',width+'px');
 }
 requestAnimationFrame(()=>{populate();if(!rail.children.length)setTimeout(populate,150);});
 // Keep highlighting honest when users navigate within the business canvas.
 doc.addEventListener('click',e=>{if(!e.target.closest('.dev-panel,.dev-nav')){directorySelection=false;requestAnimationFrame(()=>syncSelection(true));}});
 observer=new MutationObserver(()=>{const modal=doc.querySelector('[data-modal].is-open,.prototype-modal-backdrop,.modal-backdrop:not([hidden])');const shown=modal&&modal.getBoundingClientRect().height>0;document.body.classList.toggle('modal-open',!!shown);rail.inert=false;syncSelection();});observer.observe(doc.body,{subtree:true,attributes:true,childList:true});
}
function fitApp(){if(surface!=='student')return;const canvas=document.querySelector('#canvas'),scale=Math.min(1,(canvas.clientWidth-16)/500,(canvas.clientHeight-16)/920);frame.style.cssText=`position:absolute;width:500px;min-width:500px;height:920px;left:50%;top:8px;transform-origin:top center;transform:translateX(-50%) scale(${Math.max(.1,scale)});`;}
new ResizeObserver(fitApp).observe(document.querySelector('#canvas'));
frame.addEventListener('load',mount);addEventListener('hashchange',route);route();</script></body></html>
