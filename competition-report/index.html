  (() => {
    const grades = [
      {label:'1', count:1, range:'0 ≤ 總分 < 40'},
      {label:'2', count:2, range:'40 ≤ 總分 < 50'},
      {label:'3', count:3, range:'50 ≤ 總分 < 60'},
      {label:'4', count:2, range:'60 ≤ 總分 < 70'},
      {label:'5', count:0, range:'70 ≤ 總分 ≤ 100'}
    ];
    function insertGradeChart() {
      if (location.hash !== '#/class/competition-topic-5/review') return;
      const summary = document.querySelector('.topic-report .overview-section .score-summary');
      const gradeSummary = '本校共8篇作文納入等級統計，分布於等級1至4；其中等級3人數最多，有3人（37.5%）。';
      if (summary && summary.textContent !== gradeSummary) summary.textContent = gradeSummary;
      function renameHeading(selector, oldLabel, newLabel) {
        const element = document.querySelector(selector);
        if (!element) return;
        for (const node of element.childNodes) {
          if (node.nodeType === Node.TEXT_NODE && node.textContent.trim() === oldLabel) node.textContent = newLabel;
        }
        const label = element.querySelector('span:last-child');
        if (label && label.textContent === oldLabel) label.textContent = newLabel;
        if (element.title === oldLabel) element.title = newLabel;
      }
      renameHeading('.topic-report #section-2', '班級概覽', '本校概覽');
      renameHeading('.topic-report [data-toc-id="section-2"]', '班級概覽', '本校概覽');
      renameHeading('.topic-report a[href="#section-2"]', '班級概覽', '本校概覽');
      renameHeading('.topic-report #class-total-distribution', '總分分布', '等級分布');
      renameHeading('.topic-report [data-toc-id="class-total-distribution"]', '總分分布', '等級分布');
      renameHeading('.topic-report a[href="#class-total-distribution"]', '總分分布', '等級分布');
      const heading = document.querySelector('.topic-report #class-total-distribution');
      if (!heading || document.querySelector('.topic-report .topic-grade-chart-wrap')) return;
      const container = document.createElement('div');
      container.className = 'topic-grade-chart-wrap';
      const figure = document.createElement('div');
      figure.className = 'topic-grade-chart';
      figure.setAttribute('role', 'img');
      figure.setAttribute('aria-label', grades.map(g => '等級' + g.label + '：' + g.count + '人').join('；'));
      figure.innerHTML = '<div class="grade-header"><span class="grade-y-label">人數</span><details class="grade-explanation"><summary>ⓘ 等級說明</summary><div class="grade-explanation-panel"><strong>統計口徑</strong><p>按本校同題作文的有效總分統計，每篇計 1 次；總分範圍為 0–100 分。</p><strong>等級區間</strong><dl></dl></div></details></div><div class="grade-columns"></div><div class="grade-ticks"></div><span class="grade-caption">等級</span>';
      figure.querySelector('.grade-explanation-panel dl').innerHTML = grades.map(g => '<dt>' + g.label + '</dt><dd>' + g.range + '</dd>').join('');
      const columns = figure.querySelector('.grade-columns');
      const ticks = figure.querySelector('.grade-ticks');
      grades.forEach(g => {
        const column = document.createElement('div');
        column.className = 'grade-column';
        if (g.count) {
          const bar = document.createElement('div');
          bar.className = 'grade-bar';
          bar.style.height = (g.count / 3 * 150) + 'px';
          bar.innerHTML = '<span class="grade-bar-label">' + g.count + '人<small>' + (g.count / 8 * 100) + '%</small></span>';
          column.appendChild(bar);
        }
        columns.appendChild(column);
        const tick = document.createElement('span');
        tick.textContent = g.label;
        tick.title = g.range;
        ticks.appendChild(tick);
      });
      container.append(figure);
      heading.parentElement.insertAdjacentElement('afterend', container);
    }
    new MutationObserver(insertGradeChart).observe(document.getElementById('app'), {childList:true, subtree:true});
    window.addEventListener('hashchange', insertGradeChart);
    insertGradeChart();
  })();
</script><script src="./assets/updates-tab.js"></script><script src="./assets/topic-average-label.js"></script><script src="./assets/competition-chapter-three-label.js"></script></body></html>
