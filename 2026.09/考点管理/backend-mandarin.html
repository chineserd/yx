<script src="./vendor/antd.min.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;color:#303744;font-size:13px}button,input,select{font:inherit}button{cursor:pointer}.shell{min-height:100vh;background:#f4f6fb}.mast{height:48px;background:#16518c;color:#fff;display:flex;align-items:center;gap:14px;padding:0 14px}.mast .hamburger{font-size:20px}.brand-mark{width:30px;height:30px;border-radius:50%;background:#2861ee;border:3px solid white;display:grid;place-items:center;font-weight:700;font-size:17px}.mast .spacer{flex:1}.mast .small{opacity:.9;white-space:nowrap}.workspace{display:flex;min-height:calc(100vh - 48px)}aside{width:212px;flex:none;background:#1d609d;color:#fff}.side-item{height:48px;padding:0 14px;display:flex;align-items:center;gap:10px}.side-item.current{background:#155188}.side-item .chev{margin-left:auto}.side-sub{padding:0 36px;height:44px;display:flex;align-items:center}.side-sub.active{background:#155188;border-right:3px solid #fff;gap:8px}.side-badge{display:inline-block;background:#e53935;color:#fff;border-radius:3px;padding:1px 5px;font-size:10px;line-height:16px}main{flex:1;min-width:0;padding:16px 24px}.crumb{font-size:12px;color:#9ca7b7;margin:0 0 12px}.page-head{display:flex;align-items:center;gap:14px;margin-bottom:24px}.page-head h1{font-size:24px;line-height:1;margin:0;color:#252c35}.page-head .quick{font-size:13px;color:#333}.page-head .quick b{color:#fa9400}.primary{background:#2861ee;color:#fff;border:1px solid #2861ee;border-radius:4px;padding:7px 16px}.page-head .primary{margin-left:auto}.panel{background:#fff;border-radius:8px;padding:26px 24px;box-shadow:0 1px 2px #dce1eb}.library-tabs{display:grid;grid-template-columns:repeat(3,1fr);background:#f6f6f8;padding:4px;gap:4px;border-radius:4px;margin-bottom:24px}.library-tabs button{border:0;background:transparent;color:#777;padding:9px}.library-tabs button.active{background:#fff;color:#2861ee;font-weight:600;box-shadow:0 2px 8px #e9e9ee;border-radius:4px}
.filter-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 28px 36px;
  margin-bottom: 26px;
}
.field { display: flex; align-items: center; gap: 12px; min-width: 0; }
.field-label, .field > label {
  flex: 0 0 82px;
  color: #333;
  text-align: right;
  white-space: nowrap;
}
.field > input, .field > select {
  width: 100%;
  min-width: 0;
  height: 34px;
  padding: 0 10px;
  border: 1px solid #d7d7d7;
  border-radius: 4px;
  background: #fff;
  color: #555;
}
.field > input::placeholder { color: #bbb; }
.field .need {
  display: inline-block;
  margin-right: 5px;
  padding: 2px 5px;

  background: #e53935;

}
.filter-grid .ant-select, .filter-grid .ant-calendar-picker {
  flex: 1;

}

  min-height: 34px;

}

  display: flex;

  padding-inline: 8px 27px;
}
.filter-grid .ant-calendar-range-picker-input {
  flex: 1;

}

}
.actions {
  display: flex;
  align-items: center;
  gap: 10px;
}
.secondary{background:#fff;color:#666;border:1px solid #d7d7d7;border-radius:4px;padding:7px 16px}.table-wrap{overflow:auto}.paper-table{border-collapse:collapse;width:100%;min-width:1350px;white-space:nowrap}.paper-table th{text-align:left;background:#f2f5fb;color:#3b3e48;font-weight:600;padding:16px;border-bottom:1px solid #dce3ee}.paper-table td{padding:17px 16px;border-bottom:1px solid #e7e9ee;color:#666}.paper-table tr:hover td{background:#fafcff}.paper-table .name{max-width:180px;overflow:hidden;text-overflow:ellipsis}.paper-table .tags{max-width:180px;overflow:hidden;text-overflow:ellipsis}.point-tags{display:flex;gap:5px;max-width:220px;overflow:hidden}.point-tags span{border:1px solid #bfd1ff;background:#f2f6ff;color:#315fca;border-radius:3px;padding:2px 6px}.pencil{color:#2861ee;margin-right:8px}.switch{border:0;width:42px;height:23px;border-radius:12px;background:#b8bdc7;position:relative;vertical-align:middle}.switch:before{content:"";position:absolute;width:18px;height:18px;background:white;border-radius:50%;left:3px;top:2.5px;transition:left .15s}.switch.on{background:#2861ee}.switch.on:before{left:21px}.link{border:0;background:none;color:#2861ee;padding:0 10px;border-right:1px solid #e4e6eb}.link:last-child{border-right:0}.link:disabled{color:#b9bec8;cursor:default}.empty{padding:30px;text-align:center;color:#8b95a5}.foot{display:flex;justify-content:flex-end;color:#8b95a5;font-size:12px;padding-top:14px}.modal-backdrop{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:20px}.modal-backdrop.show{display:flex}.modal{background:#fff;border-radius:8px;width:min(540px,100%);padding:24px;box-shadow:0 10px 30px #0003}.modal h2{margin:0 0 16px;font-size:20px}.modal p{line-height:1.65}.modal .field{margin:12px 0}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}@media(max-width:1100px){aside{width:170px}.filter-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){.mast .small{display:none}aside{width:76px}.side-item span,.side-item .chev,.side-sub{display:none}.side-item{justify-content:center}main{padding:16px}.panel{padding:16px}.filter-grid{grid-template-columns:1fr;gap:12px}.page-head{flex-wrap:wrap}.page-head .primary{margin-left:0}}
@media (min-width: 701px) and (max-width: 900px) {
  .creation-field { grid-column: 1 / -1; }
}
@media (max-width: 530px) {
  .creation-field { flex-wrap: wrap; }
  .creation-field .field-label { text-align: left; }
  .creation-field .ant-calendar-picker { flex-basis: 100%; }
}

</head>
<body>
<div class="shell"><header class="mast"><span class="hamburger">☰</span><span class="brand-mark">路</span><span>中文路</span><span class="spacer"></span><span class="small">▣ 普通話科⌄　　◎ 繁體中文⌄　　♧ 幫助中心　　中 中文路　　⟳</span></header><div class="workspace"><aside aria-label="普通話科後台導航"><div class="side-item">♧ <span>學生管理</span><span class="chev">⌄</span></div><div class="side-item">♙ <span>普通話發音</span><span class="chev">⌄</span></div><div class="side-item">☏ <span>對話管理</span><span class="chev">⌄</span></div><div class="side-item">▤ <span>說話評估</span><span class="chev">⌄</span></div><div class="side-item">⚑ <span>聆聽與拼音</span><span class="chev">⌃</span></div><div class="side-sub">練習</div><div class="side-sub active">試卷庫<span class="side-badge">需求</span></div><div class="side-item">▥ <span>拼音練習統計</span></div><div class="side-item">⊞ <span>批量發佈任務</span></div><div class="side-item">⚙ <span>設置</span><span class="chev">⌄</span></div><div class="side-item">♧ <span>通知</span></div><div class="side-item">ⓘ <span>幫助中心</span></div></aside><main><div class="crumb">聆聽與拼音 / 試卷庫</div><div class="page-head"><h1>試卷庫</h1><span class="quick"><b>✎</b> 建議/意見</span><span class="quick"><b>★</b> 評價</span><button class="primary" id="add-paper">新增試卷</button></div><section class="panel"><div class="library-tabs" role="tablist" aria-label="試卷類別"><button class="active" data-scope="全部" role="tab" aria-selected="true">全部</button><button data-scope="公共庫" role="tab" aria-selected="false">公共庫</button><button data-scope="校本庫" role="tab" aria-selected="false">校本庫</button></div>
<form class="filter-grid" id="paper-filters">
  <div class="field">
    <label for="title">試卷標題</label>
    <input id="title" placeholder="請輸入">
  </div>
  <div class="field">
    <label for="difficulty">難度</label>
    <select id="difficulty">
      <option value="">請選擇</option>
      <option>P1</option><option>P2</option><option>P3</option>
      <option>P4</option><option>P5</option><option>P6</option><option>S1</option>
    </select>
  </div>
  <div class="field">
    <label for="type">類型</label>
    <select id="type">
      <option value="">請選擇</option><option>拼音</option><option>聆聽</option>
    </select>
  </div>
  <div class="field">
    <label for="point"><span class="need">需求</span>考點</label>
    <a-select id="point" mode="multiple" v-model:value="draft.points"
      :options="pointOptions" :show-arrow="true" allow-clear placeholder="請選擇考點">
    </a-select>
  </div>
  <div class="field">
    <label for="tag">標籤</label>
    <select id="tag">
      <option value="">請選擇</option>
      <option>三聲</option><option>y</option><option>w</option>
      <option>z</option><option>c</option><option>s</option><option>zh</option><option>ch</option><option>sh</option><option>r</option>
      <option>an</option><option>en</option><option>in</option><option>un</option><option>ün</option>
      <option>ang</option><option>eng</option><option>ing</option><option>ong</option>
      <option>上聲變調</option><option>一不變調</option><option>疊字變調</option>
      <option>平翹舌</option><option>前後鼻音</option><option>聲調變調</option>
    </select>
  </div>
  <div class="field">
    <label for="creator">創建人</label>
    <select id="creator">
      <option value="">請選擇</option><option>超級管理員</option><option>內容運營-小王</option>
    </select>
  </div>
  <div class="field creation-field" role="group" aria-labelledby="created-range-label">
    <span id="created-range-label" class="field-label"><span class="need">需求</span>創建時間</span>
    <a-range-picker v-model:value="draft.createdRange" :locale="pickerLocale"
      :placeholder="['開始日期', '結束日期']"
      format="YYYY-MM-DD" value-format="YYYY-MM-DD" separator="至" allow-clear>
    </a-range-picker>
  </div>
  <div class="actions">
    <button class="primary" id="search" type="submit">查詢</button>
    <button class="secondary" id="reset" type="button">重置</button>
  </div>
</form>
<div class="table-wrap"><table class="paper-table"><thead><tr><th>試卷標題</th><th>難度</th><th>類型</th><th>總分</th><th>題目數量</th><th>標籤</th><th><span class="side-badge">需求</span> 考點</th><th>創建人</th><th>開啟練習</th><th>創建時間</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><div class="foot" id="count"></div></section></main></div></div>
<div class="modal-backdrop" id="modal"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h2 id="modal-title"></h2><div id="modal-body"></div><div class="modal-actions"><button class="secondary" id="close">關閉</button><button class="primary" id="save" hidden>確定</button></div></div></div>
<script>
const papers=[
{id:1,name:'普通話拼音練習1',level:'P1',type:'拼音',score:100,count:10,tags:['y','w'],points:['零聲母'],creator:'超級管理員',enabled:true,created:'2025-07-10 12:39:15',scope:'公共庫',published:false},
{id:2,name:'普通話拼音練習1',level:'P2',type:'拼音',score:100,count:12,tags:['z','c','s','zh','ch','sh','r'],points:['平翹舌'],creator:'超級管理員',enabled:true,created:'2025-07-10 12:39:15',scope:'公共庫',published:false},
{id:3,name:'普通話拼音練習1',level:'P3',type:'拼音',score:100,count:12,tags:['an','en','in','un','ün','ang','eng','ing','ong'],points:['前後鼻音'],creator:'超級管理員',enabled:true,created:'2025-07-10 12:39:15',scope:'公共庫',published:false},
{id:4,name:'普通話拼音練習1',level:'P4',type:'拼音',score:100,count:9,tags:['上聲變調','一不變調','en','eng'],points:['變調','前後鼻音'],creator:'超級管理員',enabled:true,created:'2025-07-10 12:39:15',scope:'公共庫',published:false},
{id:5,name:'普通話拼音練習1',level:'P5',type:'拼音',score:100,count:10,tags:['iang','ing','in'],points:['前後鼻音'],creator:'超級管理員',enabled:true,created:'2025-07-10 12:39:15',scope:'公共庫',published:false},
{id:6,name:'普通話拼音練習1',level:'P6',type:'拼音',score:100,count:12,tags:['iang','uang'],points:['前後鼻音'],creator:'超級管理員',enabled:true,created:'2025-07-10 12:39:15',scope:'公共庫',published:false},
{id:7,name:'普通話拼音練習1',level:'S1',type:'拼音',score:100,count:10,tags:['三聲','s','ing'],points:['平翹舌','變調'],creator:'超級管理員',enabled:true,created:'2025-07-10 12:39:15',scope:'校本庫',published:false}
];
const $=id=>document.getElementById(id);let scope='全部',filters={};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const pointOptions = ['零聲母', '平翹舌', '前後鼻音', '變調', '人名拼寫規則']
  .map(point => ({ label: point, value: point }));
const draft = Vue.reactive({ points: [], createdRange: [] });

moment.defineLocale('zh-hk', {
  months: ['一月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '十一月', '十二月'],
  monthsShort: ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'],
  weekdaysMin: ['日', '一', '二', '三', '四', '五', '六'],
});
const pickerLocale = {
  lang: {
    locale: 'zh_HK',
    today: '今天',
    monthBeforeYear: false,
    yearFormat: 'YYYY年',
    previousMonth: '上個月',
    nextMonth: '下個月',
    previousYear: '上一年',
    nextYear: '下一年',
    monthSelect: '選擇月份',
    yearSelect: '選擇年份',
    decadeSelect: '選擇年代',
    previousDecade: '上一個年代',
    nextDecade: '下一個年代',
  },
};

Vue.createApp({
  setup: () => ({ draft, pointOptions, pickerLocale }),
}).use(window.antd).mount('#paper-filters');

function matchesFilters(paper) {
  const createdDate = paper.created.slice(0, 10);
  return (scope === '全部' || paper.scope === scope)
    && (!filters.title || paper.name.includes(filters.title))
    && (!filters.difficulty || paper.level === filters.difficulty)
    && (!filters.type || paper.type === filters.type)
    && (!filters.tag || paper.tags.includes(filters.tag))
    && (!filters.creator || paper.creator === filters.creator)
    && (!filters.points?.length || filters.points.some(point => paper.points.includes(point)))
    && (!filters.createdFrom || createdDate >= filters.createdFrom)
    && (!filters.createdTo || createdDate <= filters.createdTo);
}

function render() {
  const rows = papers.filter(matchesFilters);
  $('rows').innerHTML=rows.length?rows.map(p=>`<tr><td class="name" title="${esc(p.name)}">${esc(p.name)}</td><td><span class="pencil">✎</span>${esc(p.level)}</td><td>${esc(p.type)}</td><td>${p.score}</td><td>${p.count}</td><td class="tags" title="${esc(p.tags.join('、'))}">${esc(p.tags.join('、'))}</td><td><div class="point-tags">${p.points.map(v=>`<span>${esc(v)}</span>`).join('')}</div></td><td>${esc(p.creator)}</td><td><button class="switch ${p.enabled?'on':''}" data-action="toggle" data-id="${p.id}" aria-label="${p.enabled?'關閉':'開啟'}${esc(p.name)}練習" aria-pressed="${p.enabled}"></button></td><td>${esc(p.created)}</td><td><button class="link" disabled>編輯</button><button class="link" data-action="preview" data-id="${p.id}">預覽</button><button class="link" data-action="publish" data-id="${p.id}">${p.published?'已發佈':'發佈'}</button></td></tr>`).join(''):'<tr><td colspan="11" class="empty">沒有符合條件的試卷</td></tr>';$('count').textContent=`共 ${rows.length} 條`}
function openModal(title,html,onSave){$('modal-title').textContent=title;$('modal-body').innerHTML=html;$('modal').classList.add('show');$('save').hidden=!onSave;$('save').onclick=onSave||null}function closeModal(){$('modal').classList.remove('show')}
document.querySelectorAll('.library-tabs button').forEach(b=>b.addEventListener('click',()=>{scope=b.dataset.scope;document.querySelectorAll('.library-tabs button').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-selected',x===b?'true':'false')});render()}));

$('paper-filters').addEventListener('submit', event => {
  event.preventDefault();
  const [createdFrom, createdTo] = draft.createdRange || [];
  filters = {
    title: $('title').value.trim(),
    difficulty: $('difficulty').value,
    type: $('type').value,
    tag: $('tag').value,
    creator: $('creator').value,
    points: [...(draft.points || [])],
    createdFrom,
    createdTo,
  };
  render();
});
$('reset').onclick = () => {
  for (const id of ['title', 'difficulty', 'type', 'tag', 'creator']) $(id).value = '';
  draft.points = [];
  draft.createdRange = [];
  filters = {};
  render();
};
$('rows').onclick=e=>{const b=e.target.closest('[data-action]');if(!b)return;const p=papers.find(x=>x.id===Number(b.dataset.id));if(!p)return;if(b.dataset.action==='toggle'){p.enabled=!p.enabled;render()}if(b.dataset.action==='preview')openModal('試卷預覽',`<p><strong>${esc(p.name)}</strong>　${esc(p.level)}　${esc(p.scope)}</p><p>類型：${esc(p.type)}　總分：${p.score}　題目數量：${p.count}</p><p>標籤：${esc(p.tags.join('、'))}<br>考點：${esc(p.points.join('、'))}</p>`);if(b.dataset.action==='publish'){p.published=true;render();openModal('發佈成功',`<p>${esc(p.name)}（${esc(p.level)}）已標記為發佈。</p>`)}};
$('add-paper').onclick=()=>openModal('新增試卷','<div class="field"><label for="new-title">試卷標題</label><input id="new-title" placeholder="請輸入試卷標題"></div><div class="field"><label for="new-level">難度</label><select id="new-level"><option>P1</option><option>P2</option><option>P3</option><option>P4</option><option>P5</option><option>P6</option><option>S1</option></select></div><div class="field"><label for="new-point">考點</label><select id="new-point"><option>零聲母</option><option>平翹舌</option><option>前後鼻音</option><option>變調</option><option>人名拼寫規則</option></select></div>',()=>{const name=$('new-title').value.trim();if(!name){$('new-title').focus();return}papers.unshift({id:Date.now(),name,level:$('new-level').value,type:'拼音',score:100,count:0,tags:[],points:[$('new-point').value],creator:'超級管理員',enabled:false,created:new Date().toLocaleString('sv-SE'),scope:'公共庫',published:false});closeModal();render()});$('close').onclick=closeModal;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};render();
</script>
</body>
</html>
