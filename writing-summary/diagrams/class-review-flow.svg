<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1720" viewBox="0 0 1200 1720" role="img" aria-labelledby="title"><title id="title">班級作文講評八步流程</title><rect width="1200" height="1720" fill="#f6f8fc"/><style>text{font-family:PingFang TC,Microsoft JhengHei,sans-serif;fill:#263957}.h{font-size:25px;font-weight:600}.b{font-size:19px}.s{font-size:17px;fill:#52647c}</style><text x="60" y="56" class="h">共用處理 01–05 → 班級彙總 06–08</text><rect x="60" y="90" width="1080" height="170" rx="12" fill="white" stroke="#dce3ee"/><text x="88" y="124" class="h">01　學生作文報告</text><text x="88" y="162" class="b">讀取最新已完成報告的成績、原文及評語</text><text x="88" y="194" class="s">結果：本次班級報告資料</text><text x="88" y="226" class="s">異常：未完成、已撤回或無權查看的資料不納入</text><text x="590" y="284" class="h">↓</text><rect x="60" y="290" width="1080" height="170" rx="12" fill="white" stroke="#dce3ee"/><text x="88" y="324" class="h">02　校驗來源</text><text x="88" y="362" class="b">核對來源、版本及原文關聯</text><text x="88" y="394" class="s">結果：可用來源資料</text><text x="88" y="426" class="s">異常：關聯失效的案例暫不可用</text><text x="590" y="484" class="h">↓</text><rect x="60" y="490" width="1080" height="170" rx="12" fill="white" stroke="#dce3ee"/><text x="88" y="524" class="h">03　拆分評價條目</text><text x="88" y="553" class="s">拆出不同評價點，原評分、評語及批註原樣保留</text><text x="88" y="579" class="s">按班級報告框架另行生成補充分析、本班表現及教學建議，關聯原文依據</text><text x="88" y="605" class="s">結果：有來源的評價條目</text><text x="88" y="637" class="s">異常：不覆蓋原評價，不將新增分析冒充原評語</text><text x="590" y="684" class="h">↓</text><rect x="60" y="690" width="1080" height="170" rx="12" fill="white" stroke="#dce3ee"/><text x="88" y="724" class="h">04　統一問題分類</text><text x="88" y="762" class="b">明確分類沿用；缺失先按固定規則，無法分類或衝突時由AI輔助</text><text x="88" y="794" class="s">結果：問題類別與評分維度</text><text x="88" y="826" class="s">異常：無法確定時保留未分類</text><text x="590" y="884" class="h">↓</text><rect x="60" y="890" width="1080" height="170" rx="12" fill="white" stroke="#dce3ee"/><text x="88" y="924" class="h">05　確定句子唯一歸屬</text><text x="88" y="962" class="b">依主要講評點確定歸屬，同一句只歸一個維度</text><text x="88" y="994" class="s">結果：歸屬明確的案例候選</text><text x="88" y="1026" class="s">異常：衝突未解決的句子不跨維度展示</text><text x="590" y="1084" class="h">↓</text><rect x="60" y="1090" width="1080" height="170" rx="12" fill="white" stroke="#dce3ee"/><text x="88" y="1124" class="h">06　按學生統計頻次</text><text x="88" y="1162" class="b">同一學生同類只計1人，至少2人形成共同方向</text><text x="88" y="1194" class="s">結果：按涉及人數排列的共同改進方向</text><text x="88" y="1226" class="s">異常：案例暫不可用時仍保留問題統計</text><text x="590" y="1284" class="h">↓</text><rect x="60" y="1290" width="1080" height="170" rx="12" fill="white" stroke="#dce3ee"/><text x="88" y="1324" class="h">07　各維度選材與去重遞補</text><text x="88" y="1362" class="b">按各維度數量選材，結構最多3組</text><text x="88" y="1394" class="s">結果：七章講評材料</text><text x="88" y="1426" class="s">異常：同類候選不足按實際展示，不改選低頻問題</text><text x="590" y="1484" class="h">↓</text><rect x="60" y="1490" width="1080" height="170" rx="12" fill="white" stroke="#dce3ee"/><text x="88" y="1524" class="h">08　分頁和導出</text><text x="88" y="1562" class="b">按模組及頁分隔，老師查看與預覽</text><text x="88" y="1594" class="s">結果：課堂報告、文字稿與PPT</text><text x="88" y="1626" class="s">異常：導出失敗可重試</text></svg>