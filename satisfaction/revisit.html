<!doctype html><html lang="zh-CN"><head>
<meta name="robots" content="noindex, nofollow"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>回访列表 · 满意度调查</title><link rel="stylesheet" href="admin-theme.css"><link rel="stylesheet" href="revisit.css"><script id="github-pages-prototype-redirect">if(location.hostname==="chineserd.github.io")location.replace("https://chineserd-prototypes.pages.dev"+location.pathname+location.search+location.hash);</script>
</head><body class="cn-admin">
<nav class="review-nav"><div class="identity"><small>需求名稱</small><strong>滿意度調查</strong></div><a class="active" href="index.html">後台</a><a href="index.html#app">App</a><a href="index.html#prd">PRD</a><a href="index.html#api">接口說明</a><a class="history" href="/">歷史需求彙總頁</a></nav>
<aside class="revisit-sidebar"><h2>中文路后台</h2><div class="side-group">学习管理师</div><div class="side-item">工作台</div><div class="side-item">我的学员</div><div class="side-item">分配管理</div><div class="side-item">排班表</div><div class="side-item">换老师试听</div><div class="side-item">工单列表</div><div class="side-item">新生任务</div><a class="side-item current" href="revisit.html" aria-current="page">回访列表 <em>需求</em></a><div class="side-item">班级回访</div><div class="side-item">待排课表</div><div class="side-group">教务系统</div><a class="side-item" href="index.html">教学评价</a></aside>
<div class="revisit-shell"><header class="work-header"><span>学习管理师 / 回访列表</span><span>中国香港 / CN HK</span></header><div class="work-tabs"><span class="current">回访列表</span><a href="index.html">满意度调查</a></div><main class="revisit-main"><h1>回访列表</h1>
<form id="visitFilters" class="filter-card">
<label>学生姓名<input name="name" placeholder="请输入学生姓名"></label><label>学生编号<input name="code" placeholder="请输入学生编号"></label><label>所属学管<select name="manager"><option value="">全部学管</option><option>香港澳门老师</option><option>熊二老师</option><option>徐老师</option></select></label><label>创建时间<span class="date-range"><input type="date" name="createdStart" aria-label="创建开始日期"><span>至</span><input type="date" name="createdEnd" aria-label="创建结束日期"></span></label>
<label>完成时间<span class="date-range"><input type="date" name="doneStart" aria-label="完成开始日期"><span>至</span><input type="date" name="doneEnd" aria-label="完成结束日期"></span></label><label>校区<select name="campus"><option value="">全部校区</option><option>香港校区</option><option>澳门校区</option><option>线上校区</option></select></label><label>类型筛选<select name="type" aria-label="类型筛选"><option value="">全部类型</option><option>逾期</option><option>缺勤</option><option>分享赠堂</option><option>评价回访</option></select></label><div class="filter-actions"><button class="primary" type="submit">查询</button><button type="reset">重置</button></div><p id="visitFilterError" role="alert" hidden></p></form>
<section class="list-card"><div class="status-tabs" role="tablist" aria-label="回访状态"><button role="tab" aria-selected="true" data-status="待处理">待处理</button><button role="tab" aria-selected="false" data-status="处理中">处理中</button><button role="tab" aria-selected="false" data-status="已完成">已完成</button></div><div class="visit-table"><table><thead><tr><th>学生编号</th><th>学生姓名</th><th>状态</th><th>创建时间</th><th>负责学管</th><th>类型</th><th>倒计时</th><th>完成时间</th><th>操作</th></tr></thead><tbody id="visitRows"></tbody></table></div><div class="visit-pagination"><span id="visitCount"></span><button id="prevPage">上一页</button><span id="pageInfo"></span><button id="nextPage">下一页</button></div></section></main></div>
<dialog id="visitDialog" aria-labelledby="visitTitle"><form id="visitDetailForm"><header><h2 id="visitTitle">回访详情</h2><button type="button" id="closeVisit" aria-label="关闭回访详情">×</button></header><div class="dialog-content"><div id="visitInfo"></div><section id="visitEvaluation"></section><div class="follow-form"><label>回访状态<select id="visitStatus"><option>待处理</option><option>处理中</option><option>已完成</option></select></label><label>回访备注<textarea id="visitNote" maxlength="500" placeholder="记录沟通情况与后续安排"></textarea></label></div><p id="visitSaveError" role="alert"></p></div><footer><button type="button" id="cancelVisit">取消</button><button type="submit" class="primary">保存</button></footer></form></dialog><script src="revisit.js"></script></body></html>
